<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>BONKERS BLITZ - The Wackiest Game Ever</title>
<style>
/* ============================================ */
/* RESET & FOUNDATION                           */
/* ============================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --hot-pink: #ff1493;
    --electric-blue: #00e5ff;
    --acid-green: #76ff03;
    --vivid-orange: #ff6d00;
    --psycho-purple: #d500f9;
    --banana-yellow: #ffea00;
    --lava-red: #ff1744;
    --mint: #1de9b6;
    --dark: #0d0221;
    --darker: #060114;
    --card: rgba(13, 2, 33, 0.9);
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--darker);
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
    cursor: default;
}

/* ============================================ */
/* GLOBAL CANVAS                                */
/* ============================================ */
#bgCanvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
}

/* ============================================ */
/* SCREENS                                      */
/* ============================================ */
.screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
}

.screen.active {
    display: flex;
}

/* ============================================ */
/* ANIMATIONS - THE FUN STUFF                   */
/* ============================================ */
@keyframes titleBounce {
    0%, 100% { transform: scale(1) rotate(-1deg); }
    25% { transform: scale(1.05) rotate(1deg); }
    50% { transform: scale(0.97) rotate(-0.5deg); }
    75% { transform: scale(1.03) rotate(0.5deg); }
}

@keyframes wobble {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(3deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(-3deg); }
    100% { transform: rotate(0deg); }
}

@keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.2); }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes zoomSpin {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}

@keyframes slideUp {
    from { transform: translateY(60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes slideDown {
    from { transform: translateY(-60px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-6px); }
    20%, 40%, 60%, 80% { transform: translateX(6px); }
}

@keyframes megaShake {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    10% { transform: translate(-8px, 4px) rotate(-2deg); }
    20% { transform: translate(8px, -4px) rotate(2deg); }
    30% { transform: translate(-6px, -6px) rotate(-1deg); }
    40% { transform: translate(6px, 6px) rotate(1deg); }
    50% { transform: translate(-4px, 2px) rotate(-2deg); }
    60% { transform: translate(4px, -2px) rotate(2deg); }
    70% { transform: translate(-8px, 4px) rotate(-1deg); }
    80% { transform: translate(8px, -4px) rotate(1deg); }
    90% { transform: translate(-4px, -4px) rotate(0deg); }
}

@keyframes rainbow {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
}

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}

@keyframes stretch {
    0%, 100% { transform: scaleX(1) scaleY(1); }
    25% { transform: scaleX(1.2) scaleY(0.8); }
    50% { transform: scaleX(0.9) scaleY(1.1); }
    75% { transform: scaleX(1.1) scaleY(0.9); }
}

@keyframes confettiFall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}

@keyframes firework {
    0% { transform: scale(0); opacity: 1; }
    100% { transform: scale(3); opacity: 0; }
}

@keyframes textGlitch {
    0%, 100% { text-shadow: 2px 0 var(--hot-pink), -2px 0 var(--electric-blue); }
    25% { text-shadow: -2px 2px var(--acid-green), 2px -2px var(--vivid-orange); }
    50% { text-shadow: 2px -2px var(--psycho-purple), -2px 2px var(--banana-yellow); }
    75% { text-shadow: -2px -2px var(--lava-red), 2px 2px var(--mint); }
}

@keyframes countPop {
    0% { transform: scale(4); opacity: 0; }
    40% { transform: scale(0.8); opacity: 1; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
}

@keyframes timerPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255,23,68,0.4); }
    50% { box-shadow: 0 0 0 12px rgba(255,23,68,0); }
}

@keyframes flyAcross {
    from { transform: translateX(-100px); }
    to { transform: translateX(calc(100vw + 100px)); }
}

@keyframes dropIn {
    0% { transform: translateY(-200%) rotate(-20deg); }
    60% { transform: translateY(10%) rotate(5deg); }
    80% { transform: translateY(-5%) rotate(-2deg); }
    100% { transform: translateY(0) rotate(0deg); }
}

@keyframes squish {
    0% { transform: scaleY(1) scaleX(1); }
    30% { transform: scaleY(0.7) scaleX(1.3); }
    50% { transform: scaleY(1.1) scaleX(0.9); }
    70% { transform: scaleY(0.95) scaleX(1.05); }
    100% { transform: scaleY(1) scaleX(1); }
}

@keyframes wiggle {
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(8deg); }
    40% { transform: rotate(-8deg); }
    60% { transform: rotate(5deg); }
    80% { transform: rotate(-5deg); }
}

@keyframes rubberBand {
    0% { transform: scaleX(1); }
    30% { transform: scaleX(1.25) scaleY(0.75); }
    40% { transform: scaleX(0.75) scaleY(1.25); }
    50% { transform: scaleX(1.15) scaleY(0.85); }
    65% { transform: scaleX(0.95) scaleY(1.05); }
    75% { transform: scaleX(1.05) scaleY(0.95); }
    100% { transform: scaleX(1); }
}

@keyframes jello {
    0%, 100% { transform: skewX(0deg) skewY(0deg); }
    11% { transform: skewX(-3deg) skewY(-3deg); }
    22% { transform: skewX(3deg) skewY(3deg); }
    33% { transform: skewX(-2deg) skewY(-2deg); }
    44% { transform: skewX(2deg) skewY(2deg); }
    55% { transform: skewX(-1deg) skewY(-1deg); }
    66% { transform: skewX(1deg) skewY(1deg); }
}

/* ============================================ */
/* TITLE SCREEN                                 */
/* ============================================ */
#titleScreen {
    background: radial-gradient(ellipse at 30% 40%, rgba(213,0,249,0.15) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(255,20,147,0.1) 0%, transparent 50%),
                radial-gradient(ellipse at center, rgba(13,2,33,0.95) 0%, var(--darker) 100%);
}

.title-container {
    text-align: center;
    perspective: 800px;
}

.title-main {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(3rem, 12vw, 8rem);
    line-height: 0.95;
    animation: titleBounce 2s ease-in-out infinite;
    letter-spacing: -2px;
}

.title-main .bonkers {
    display: block;
    background: linear-gradient(135deg, var(--hot-pink), var(--vivid-orange), var(--banana-yellow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(255,20,147,0.5));
}

.title-main .blitz {
    display: block;
    background: linear-gradient(135deg, var(--electric-blue), var(--acid-green), var(--mint));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 30px rgba(0,229,255,0.5));
    font-size: 0.85em;
}

.title-tagline {
    font-size: clamp(0.8rem, 2.5vw, 1.2rem);
    color: rgba(255,255,255,0.5);
    margin: 15px 0 30px;
    letter-spacing: 3px;
    text-transform: uppercase;
    animation: slideUp 0.8s ease 0.3s both;
}

.title-mascot {
    font-size: clamp(3rem, 8vw, 5rem);
    animation: wobble 1.5s ease-in-out infinite;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.3));
}

/* ============================================ */
/* BUTTONS                                      */
/* ============================================ */
.btn {
    display: inline-block;
    padding: 16px 45px;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    position: relative;
    overflow: hidden;
}

.btn::after {
    content: '';
    position: absolute;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s;
}

.btn:hover::after { opacity: 1; }

.btn:active {
    transform: scale(0.92);
    filter: brightness(0.9);
}

.btn-play {
    background: linear-gradient(135deg, var(--hot-pink), var(--psycho-purple));
    color: #fff;
    box-shadow: 0 6px 30px rgba(255,20,147,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    animation: pulse 2s ease-in-out infinite;
    font-size: clamp(1.3rem, 3vw, 1.8rem);
    padding: 20px 60px;
}

.btn-play:hover {
    box-shadow: 0 8px 40px rgba(255,20,147,0.6);
    transform: translateY(-3px) scale(1.02);
}

.btn-alt {
    background: rgba(255,255,255,0.08);
    color: #aaa;
    border: 2px solid rgba(255,255,255,0.1);
    padding: 12px 30px;
    font-size: 0.9rem;
}

.btn-alt:hover {
    border-color: rgba(255,255,255,0.3);
    color: #fff;
    background: rgba(255,255,255,0.12);
}

.btn-neon {
    background: transparent;
    border: 3px solid var(--electric-blue);
    color: var(--electric-blue);
    text-shadow: 0 0 10px var(--electric-blue);
    box-shadow: 0 0 15px rgba(0,229,255,0.2), inset 0 0 15px rgba(0,229,255,0.05);
}

.btn-neon:hover {
    background: rgba(0,229,255,0.1);
    box-shadow: 0 0 25px rgba(0,229,255,0.4), inset 0 0 25px rgba(0,229,255,0.1);
}

.btn-fire {
    background: linear-gradient(135deg, var(--vivid-orange), var(--lava-red));
    color: #fff;
    box-shadow: 0 4px 20px rgba(255,109,0,0.4);
}

.btn-success {
    background: linear-gradient(135deg, var(--acid-green), var(--mint));
    color: #000;
    font-weight: 900;
}

/* ============================================ */
/* GAME HUD                                     */
/* ============================================ */
.hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 15px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(10px);
    z-index: 100;
    border-bottom: 2px solid rgba(255,255,255,0.05);
}

.hud-score {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 1.6rem;
    background: linear-gradient(90deg, var(--banana-yellow), var(--vivid-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.hud-lives {
    display: flex;
    gap: 4px;
    font-size: 1.3rem;
}

.hud-life { transition: all 0.3s; }
.hud-life.lost { opacity: 0.15; transform: scale(0.7); filter: grayscale(1); }

.hud-speed {
    font-size: 0.8rem;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.hud-round {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    font-weight: 600;
}

.hud-combo {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 1.1rem;
    color: var(--vivid-orange);
    text-shadow: 0 0 8px var(--vivid-orange);
    opacity: 0;
    transition: all 0.2s;
}

.hud-combo.active { opacity: 1; }

/* ============================================ */
/* TIMER BAR                                    */
/* ============================================ */
.timer-wrap {
    position: absolute;
    top: 50px; left: 0; right: 0;
    height: 5px;
    background: rgba(255,255,255,0.06);
    z-index: 100;
}

.timer-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--acid-green), var(--banana-yellow), var(--vivid-orange), var(--lava-red));
    transition: width 0.05s linear;
    border-radius: 0 3px 3px 0;
}

.timer-fill.danger {
    animation: timerPulse 0.4s ease infinite;
}

/* ============================================ */
/* GAME AREA                                    */
/* ============================================ */
.game-area {
    position: absolute;
    top: 55px; left: 0; right: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 10px;
}

/* ============================================ */
/* INSTRUCTION BANNER                           */
/* ============================================ */
.instruction {
    position: absolute;
    top: 65px; left: 0; right: 0;
    text-align: center;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(1.4rem, 4.5vw, 2.8rem);
    text-transform: uppercase;
    letter-spacing: 2px;
    z-index: 50;
    animation: dropIn 0.35s ease both;
    padding: 0 15px;
    pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
}

/* ============================================ */
/* OVERLAYS                                     */
/* ============================================ */
.overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 500;
}

.overlay.active { display: flex; }

#countdownOverlay {
    background: rgba(0,0,0,0.88);
    z-index: 600;
}

.countdown-text {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(6rem, 20vw, 12rem);
    animation: countPop 0.7s ease;
}

#resultOverlay {
    z-index: 500;
    backdrop-filter: blur(3px);
}

.result-emoji {
    font-size: clamp(4rem, 12vw, 8rem);
    animation: zoomSpin 0.4s ease;
}

.result-text {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(2rem, 7vw, 4.5rem);
    animation: rubberBand 0.6s ease 0.1s both;
    text-align: center;
}

.result-subtext {
    font-size: 1.2rem;
    animation: slideUp 0.4s ease 0.2s both;
    margin-top: 5px;
}

/* ============================================ */
/* ROUND TRANSITION                             */
/* ============================================ */
#roundOverlay {
    background: rgba(0,0,0,0.92);
    z-index: 550;
}

.round-text {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(2.5rem, 10vw, 6rem);
    animation: zoomSpin 0.5s ease;
}

.round-speed {
    font-size: clamp(1rem, 3vw, 1.5rem);
    font-weight: 700;
    margin-top: 8px;
    animation: slideUp 0.5s ease 0.2s both;
}

.round-tip {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.4);
    margin-top: 12px;
    animation: fadeIn 0.5s ease 0.4s both;
    font-style: italic;
}

/* ============================================ */
/* GAME OVER                                    */
/* ============================================ */
#gameOverScreen {
    background: radial-gradient(ellipse at center, rgba(13,2,33,0.97) 0%, var(--darker) 100%);
    overflow-y: auto;
}

.gameover-wrap {
    text-align: center;
    padding: 30px 20px;
    max-width: 650px;
    width: 90%;
}

.gameover-title {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(2.5rem, 8vw, 5rem);
    animation: textGlitch 0.5s ease;
    margin-bottom: 5px;
}

.final-score-num {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(4rem, 14vw, 8rem);
    background: linear-gradient(135deg, var(--banana-yellow), var(--vivid-orange), var(--hot-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 20px rgba(255,234,0,0.3));
    animation: popIn 0.5s ease 0.2s both;
}

.rank-display {
    display: inline-block;
    padding: 10px 35px;
    border-radius: 50px;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 1.5rem;
    margin: 10px 0 20px;
    animation: popIn 0.5s ease 0.3s both;
}

.stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
}

.stat-box {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 12px;
}

.stat-num {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 1.8rem;
}

.stat-lbl {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    margin-top: 2px;
}

.go-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 15px;
}

/* ============================================ */
/* LEADERBOARD                                  */
/* ============================================ */
#lbScreen {
    background: radial-gradient(ellipse at center, rgba(13,2,33,0.97) 0%, var(--darker) 100%);
    overflow-y: auto;
}

.lb-wrap {
    width: 90%;
    max-width: 550px;
    padding: 30px 0;
    text-align: center;
}

.lb-title {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 2.2rem;
    margin-bottom: 18px;
    background: linear-gradient(90deg, var(--banana-yellow), var(--vivid-orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.lb-entry {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 6px;
    transition: all 0.2s;
}

.lb-entry:nth-child(1) { border-color: #ffd700; background: rgba(255,215,0,0.05); }
.lb-entry:nth-child(2) { border-color: #c0c0c0; }
.lb-entry:nth-child(3) { border-color: #cd7f32; }

.lb-rank {
    font-family: 'Impact', sans-serif;
    font-size: 1.2rem;
    width: 30px;
    text-align: center;
}

.lb-entry:nth-child(1) .lb-rank { color: #ffd700; }
.lb-entry:nth-child(2) .lb-rank { color: #c0c0c0; }
.lb-entry:nth-child(3) .lb-rank { color: #cd7f32; }

.lb-name { flex: 1; text-align: left; font-weight: 600; }
.lb-score {
    font-family: 'Impact', sans-serif;
    font-size: 1.3rem;
    color: var(--banana-yellow);
}

/* ============================================ */
/* MICRO-GAME SPECIFIC STYLES                   */
/* ============================================ */

/* Generic clickable target */
.click-target {
    cursor: pointer;
    transition: transform 0.1s;
    position: absolute;
}

.click-target:active {
    transform: scale(0.85) !important;
}

/* Fly swat */
.fly {
    font-size: 2.5rem;
    cursor: pointer;
    position: absolute;
    transition: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    z-index: 20;
}

/* Balloon */
.balloon {
    position: absolute;
    cursor: pointer;
    transition: transform 0.1s;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.balloon:hover {
    transform: scale(1.1);
}

/* Button game */
.big-button {
    width: clamp(120px, 30vw, 200px);
    height: clamp(120px, 30vw, 200px);
    border-radius: 50%;
    border: none;
    cursor: pointer;
    font-size: 2rem;
    font-weight: 900;
    font-family: inherit;
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative;
}

.big-button:active {
    transform: scale(0.9);
}

/* Progress ring */
.progress-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
}

/* Dodge game */
.player-char {
    position: absolute;
    font-size: 3rem;
    transition: left 0.08s ease-out, top 0.08s ease-out;
    z-index: 10;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
}

.obstacle {
    position: absolute;
    font-size: 2rem;
    z-index: 5;
}

/* Match game items */
.match-grid {
    display: grid;
    gap: 10px;
    justify-content: center;
}

.match-card {
    background: rgba(255,255,255,0.06);
    border: 3px solid rgba(255,255,255,0.1);
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    cursor: pointer;
    transition: all 0.15s;
    aspect-ratio: 1;
}

.match-card:hover {
    border-color: var(--electric-blue);
    background: rgba(0,229,255,0.08);
    transform: scale(1.05);
}

.match-card:active { transform: scale(0.92); }

.match-card.correct {
    border-color: var(--acid-green) !important;
    background: rgba(118,255,3,0.15) !important;
    animation: popIn 0.3s ease;
}

.match-card.wrong {
    border-color: var(--lava-red) !important;
    background: rgba(255,23,68,0.15) !important;
    animation: shake 0.3s ease;
}

/* Tap counter */
.tap-area {
    width: clamp(200px, 50vw, 350px);
    height: clamp(200px, 50vw, 350px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    transition: transform 0.05s;
    position: relative;
}

.tap-area:active { transform: scale(0.93); }

.tap-count {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(3rem, 10vw, 6rem);
}

/* Timing game */
.timing-bar {
    width: 80%;
    max-width: 500px;
    height: 50px;
    background: rgba(255,255,255,0.06);
    border-radius: 25px;
    position: relative;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
}

.timing-zone {
    position: absolute;
    top: 0; bottom: 0;
    border-radius: 25px;
}

.timing-needle {
    position: absolute;
    top: -5px; bottom: -5px;
    width: 4px;
    background: #fff;
    border-radius: 2px;
    box-shadow: 0 0 10px #fff;
    z-index: 10;
}

/* Simon game */
.simon-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    width: clamp(200px, 60vw, 350px);
}

.simon-btn {
    aspect-ratio: 1;
    border-radius: 16px;
    border: none;
    cursor: pointer;
    font-size: 2.5rem;
    transition: all 0.1s;
    opacity: 0.5;
}

.simon-btn.lit {
    opacity: 1;
    transform: scale(1.05);
    box-shadow: 0 0 30px currentColor;
}

.simon-btn:active { transform: scale(0.9); }

/* Catch game */
.catcher {
    position: absolute;
    bottom: 30px;
    font-size: 3rem;
    transition: left 0.06s ease-out;
    z-index: 10;
}

.falling-item {
    position: absolute;
    font-size: 2rem;
    z-index: 5;
}

/* Drawing dots */
.dot-target {
    position: absolute;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 3px solid;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.15s;
}

.dot-target:hover { transform: scale(1.2); }
.dot-target.hit {
    background: var(--acid-green) !important;
    border-color: var(--acid-green) !important;
    color: #000 !important;
    animation: popIn 0.2s ease;
}

/* Reaction test */
.reaction-zone {
    width: clamp(250px, 60vw, 400px);
    height: clamp(250px, 60vw, 400px);
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    transition: background 0.1s;
}

/* Color picker */
.color-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: clamp(250px, 70vw, 400px);
}

.color-swatch {
    aspect-ratio: 1;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s;
    border: 3px solid transparent;
}

.color-swatch:hover {
    transform: scale(1.08);
    border-color: rgba(255,255,255,0.3);
}

.color-swatch:active { transform: scale(0.92); }

/* Maze character */
.maze-container {
    position: relative;
    width: clamp(280px, 80vw, 500px);
    height: clamp(280px, 80vw, 500px);
}

/* Whack-a-mole */
.mole-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    width: clamp(250px, 70vw, 380px);
}

.mole-hole {
    aspect-ratio: 1;
    background: rgba(139,69,19,0.3);
    border-radius: 50%;
    border: 3px solid rgba(139,69,19,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.5rem;
    cursor: pointer;
    transition: all 0.1s;
    overflow: hidden;
}

.mole-hole:active { transform: scale(0.9); }

.mole-hole .mole-emoji {
    transition: transform 0.2s;
    transform: translateY(100%);
}

.mole-hole.up .mole-emoji {
    transform: translateY(0);
}

/* Shake meter */
.shake-meter {
    width: 80%;
    max-width: 400px;
    height: 40px;
    background: rgba(255,255,255,0.06);
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid rgba(255,255,255,0.1);
}

.shake-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 0.1s;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }

/* ============================================ */
/* FLOATING POINTS                              */
/* ============================================ */
.float-pts {
    position: fixed;
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 2rem;
    pointer-events: none;
    z-index: 300;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

@keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.5); }
}

/* ============================================ */
/* PAUSE                                        */
/* ============================================ */
#pauseOverlay {
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(12px);
    z-index: 700;
}

.pause-title {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 3rem;
    color: var(--electric-blue);
    text-shadow: 0 0 20px var(--electric-blue);
    margin-bottom: 25px;
    animation: wobble 2s ease-in-out infinite;
}

.pause-btns {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 250px;
}

.pause-btns .btn { width: 100%; text-align: center; }

/* ============================================ */
/* RESPONSIVE                                   */
/* ============================================ */
@media (max-width: 600px) {
    .hud { padding: 0 10px; height: 44px; }
    .hud-score { font-size: 1.3rem; }
    .hud-lives { font-size: 1.1rem; }
    .stats-row { grid-template-columns: repeat(2, 1fr); }
}
</style>

<body>

<canvas id="bgCanvas"></canvas>

<!-- TITLE -->

    <div class="title-container">
        <div class="title-mascot">🤪</div>

    </div>
</div>

<script>
/* ================================================================ */
/*  BONKERS BLITZ - THE WACKIEST GAME ENGINE                        */
/*  A hyper-speed micro-game party in one file                      */
/* ================================================================ */

// ==========================================
// AUDIO ENGINE
// ==========================================
const SFX = {
    ctx: null,
    vol: 0.25,
    init() {
        if (this.ctx) return;
        try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    },
    play(freq, dur, type = 'square', v = 0.2) {
        if (!this.ctx) return;
        const o = this.ctx.createOscillator(), g = this.ctx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(v * this.vol, this.ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        o.connect(g); g.connect(this.ctx.destination);
        o.start(); o.stop(this.ctx.currentTime + dur);
    },
    correct() { this.play(523,0.08); setTimeout(()=>this.play(659,0.08),60); setTimeout(()=>this.play(880,0.12),120); },
    wrong() { this.play(200,0.12,'sawtooth',0.2); setTimeout(()=>this.play(140,0.2,'sawtooth',0.2),100); },
    tick() { this.play(800,0.03,'square',0.1); },
    go() { this.play(880,0.25,'square',0.3); },
    combo() { [880,1108,1318,1568].forEach((n,i)=>setTimeout(()=>this.play(n,0.08,'sine',0.2),i*40)); },
    boom() { this.play(80,0.3,'sawtooth',0.3); setTimeout(()=>this.play(60,0.4,'sawtooth',0.25),100); },
    pop() { this.play(1200,0.05,'sine',0.15); },
    whoosh() { const o=this.ctx?.createOscillator(),g=this.ctx?.createGain(); if(!o)return; o.type='sawtooth';o.frequency.setValueAtTime(400,this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(100,this.ctx.currentTime+0.15);g.gain.setValueAtTime(0.08,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.15);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+0.15); },
    levelUp() { [523,587,659,784,880,1047].forEach((n,i)=>setTimeout(()=>this.play(n,0.1,'square',0.2),i*50)); },
    gameOver() { [392,349,330,294,262].forEach((n,i)=>setTimeout(()=>this.play(n,0.25,'triangle',0.25),i*180)); },
    victory() { [523,659,784,1047,1318,1568,2093].forEach((n,i)=>setTimeout(()=>this.play(n,0.12,'sine',0.2),i*60)); }
};

// ==========================================
// BACKGROUND
// ==========================================
class BG {
    constructor(c) {
        this.c = c; this.x = c.getContext('2d'); this.p = []; this.stars = []; this.t = 0;
        this.resize(); window.addEventListener('resize', () => this.resize());
        for (let i = 0; i < 80; i++) this.stars.push({ x: Math.random()*c.width, y: Math.random()*c.height, s: Math.random()*2+0.5, b: Math.random(), bs: Math.random()*0.02+0.005, sp: Math.random()*0.2+0.1 });
        this.loop();
    }
    resize() { this.c.width = innerWidth; this.c.height = innerHeight; }
    burst(x, y, col, n = 25) {
        for (let i = 0; i < n; i++) {
            const a = (Math.PI*2/n)*i + Math.random()*0.5, sp = Math.random()*5+2;
            this.p.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, l: 1, d: Math.random()*0.02+0.01, s: Math.random()*4+2, c: col });
        }
    }
    confetti(n = 50) {
        const cols = ['#ff1493','#00e5ff','#76ff03','#ffea00','#ff6d00','#d500f9','#ff1744','#1de9b6'];
        for (let i = 0; i < n; i++) this.p.push({
            x: Math.random()*this.c.width, y: -20, vx: Math.random()*4-2, vy: Math.random()*3+2,
            l: 1, d: 0.003+Math.random()*0.003, s: Math.random()*6+3,
            c: cols[~~(Math.random()*cols.length)], rot: Math.random()*Math.PI*2, rs: Math.random()*0.1-0.05, conf: true
        });
    }
    loop() {
        this.t += 0.008;
        const { x: ctx, c } = this, w = c.width, h = c.height;
        const g = ctx.createRadialGradient(w/2,h/2,0,w/2,h/2,Math.max(w,h)*0.7);
        g.addColorStop(0,'#0d0221'); g.addColorStop(1,'#060114');
        ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
        // grid
        ctx.strokeStyle = 'rgba(255,255,255,0.02)'; ctx.lineWidth = 1;
        const gs = 50, ox = (this.t*18)%gs, oy = (this.t*12)%gs;
        for (let x = -gs+ox; x < w+gs; x+=gs) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
        for (let y = -gs+oy; y < h+gs; y+=gs) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
        // stars
        this.stars.forEach(s => {
            s.b += s.bs; const a = 0.3+Math.sin(s.b)*0.4;
            ctx.fillStyle = `rgba(255,255,255,${Math.max(0.05,a)})`;
            ctx.beginPath(); ctx.arc(s.x,s.y,s.s,0,Math.PI*2); ctx.fill();
            s.y += s.sp; if (s.y > h+10) { s.y = -10; s.x = Math.random()*w; }
        });
        // particles
        for (let i = this.p.length-1; i >= 0; i--) {
            const p = this.p[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.06; p.l -= p.d;
            if (p.l <= 0) { this.p.splice(i,1); continue; }
            ctx.save(); ctx.globalAlpha = p.l; ctx.fillStyle = p.c;
            if (p.conf) { p.rot += p.rs; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); }
            else { ctx.beginPath(); ctx.arc(p.x,p.y,p.s*p.l,0,Math.PI*2); ctx.fill(); }
            ctx.restore();
        }
        requestAnimationFrame(() => this.loop());
    }
}

// ==========================================
// HELPERS
// ==========================================
const R = (a, b) => ~~(Math.random()*(b-a+1))+a;
const RF = (a, b) => Math.random()*(b-a)+a;
const pick = a => a[~~(Math.random()*a.length)];
const shuffle = a => { const b=[...a]; for(let i=b.length-1;i>0;i--){const j=~~(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];} return b; };
const clamp = (v,lo,hi) => Math.max(lo,Math.min(hi,v));
const lerp = (a,b,t) => a+(b-a)*t;
const dist = (x1,y1,x2,y2) => Math.sqrt((x2-x1)**2+(y2-y1)**2);
const esc = s => { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; };
const $ = id => document.getElementById(id);
const area = () => $('gameArea');

// ==========================================
// GAME STATE
// ==========================================
const CFG = {
    lives: 4, maxLives: 5,
    baseTime: 5000, minTime: 2000, timeDecay: 200,
    gamesPerRound: 5, maxRounds: 15,
    basePoints: 100, comboStep: 0.5, maxCombo: 8
};

let G = {
    score: 0, lives: 0, round: 1, gameNum: 0, totalGames: 0,
    combo: 0, maxCombo: 0, streak: 0, bestStreak: 0,
    correct: 0, wrong: 0,
    paused: false, answering: false,
    timer: null, timeLeft: 0, totalTime: 0,
    current: null, startTime: null
};

let bg;

// ==========================================
// INIT
// ==========================================
document.addEventListener('DOMContentLoaded', () => {
    bg = new BG($('bgCanvas'));
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') G.paused ? unpause() : (G.answering && pause());
    });
});

// ==========================================
// SCREENS
// ==========================================
function showScreen(id) {
    SFX.init();
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
}

// ==========================================
// GAME START
// ==========================================
function startGame() {
    SFX.init(); SFX.whoosh();
    G = { score:0, lives:CFG.lives, round:1, gameNum:0, totalGames:0,
          combo:0, maxCombo:0, streak:0, bestStreak:0, correct:0, wrong:0,
          paused:false, answering:false, timer:null, timeLeft:0, totalTime:0,
          current:null, startTime:Date.now() };
    showScreen('gameScreen');
    updateHUD();
    showRound();
}

// ==========================================
// HUD
// ==========================================
function updateHUD() {
    $('hudScore').textContent = G.score.toLocaleString();
    $('hudRound').textContent = `R${G.round}`;

    let livesHTML = '';
    for (let i = 0; i < CFG.maxLives; i++)
        livesHTML += `<span class="hud-life ${i >= G.lives ? 'lost' : ''}">💜</span>`;
    $('hudLives').innerHTML = livesHTML;

    const speeds = [
        { t: 'CHILL', c: '#76ff03', bg: 'rgba(118,255,3,0.15)' },
        { t: 'WARMING UP', c: '#ffea00', bg: 'rgba(255,234,0,0.15)' },
        { t: 'SPICY!', c: '#ff6d00', bg: 'rgba(255,109,0,0.15)' },
        { t: 'ON FIRE!!', c: '#ff1744', bg: 'rgba(255,23,68,0.15)' },
        { t: 'BONKERS!!!', c: '#d500f9', bg: 'rgba(213,0,249,0.15)' }
    ];
    const si = Math.min(Math.floor((G.round-1)/3), speeds.length-1);
    const sp = speeds[si];
    $('hudSpeed').textContent = sp.t;
    $('hudSpeed').style.color = sp.c;
    $('hudSpeed').style.background = sp.bg;
    $('hudSpeed').style.border = `1px solid ${sp.c}33`;

    const ce = $('hudCombo');
    if (G.combo >= 2) { ce.textContent = `x${G.combo}!`; ce.classList.add('active'); }
    else ce.classList.remove('active');
}

// ==========================================
// TIMER
// ==========================================
function startTimer(dur) {
    G.totalTime = dur; G.timeLeft = dur;
    const bar = $('timerBar');
    bar.style.width = '100%'; bar.classList.remove('danger');
    if (G.timer) clearInterval(G.timer);
    const t0 = Date.now();
    G.timer = setInterval(() => {
        if (G.paused) return;
        G.timeLeft = Math.max(0, dur - (Date.now() - t0));
        const pct = (G.timeLeft / dur) * 100;
        bar.style.width = pct + '%';
        if (pct < 25) bar.classList.add('danger');
        if (G.timeLeft <= 0) { clearInterval(G.timer); if (G.answering) answer(null, true); }
    }, 30);
}

function stopTimer() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }

function getTime() { return Math.max(CFG.minTime, CFG.baseTime - (G.round-1)*CFG.timeDecay); }

// ==========================================
// ROUND TRANSITIONS
// ==========================================
function showRound() {
    const el = $('roundOverlay');
    const colors = ['var(--acid-green)','var(--banana-yellow)','var(--vivid-orange)','var(--lava-red)','var(--psycho-purple)'];
    const ci = Math.min(Math.floor((G.round-1)/3), colors.length-1);
    const tips = [
        'Click, tap, and react as fast as you can!',
        'Things are speeding up... stay sharp!',
        'Trust your instincts!',
        'Every millisecond counts now!',
        'You are a BONKERS legend!',
        'Pure chaos mode activated!',
        'This is beyond human speed...',
        'Are you even real?!'
    ];
    el.innerHTML = `
        <div class="round-text" style="color:${colors[ci]}">ROUND ${G.round}</div>
        <div class="round-speed" style="color:${colors[ci]}">${$('hudSpeed').textContent}</div>
        <div class="round-tip">${tips[Math.min(G.round-1, tips.length-1)]}</div>
    `;
    el.classList.add('active');
    SFX.levelUp();
    setTimeout(() => { el.classList.remove('active'); nextGame(); }, 1800);
}

// ==========================================
// GAME FLOW
// ==========================================
function nextGame() {
    if (G.lives <= 0) return gameOver();
    if (G.gameNum >= CFG.gamesPerRound) {
        G.round++; G.gameNum = 0;
        if (G.round > CFG.maxRounds) return gameOver(true);
        updateHUD(); showRound(); return;
    }
    const game = pickGame();
    G.current = game; G.totalGames++; G.gameNum++;
    showCountdown(game, () => {
        G.answering = true;
        game.start();
        startTimer(getTime());
    });
}

function showCountdown(game, cb) {
    const el = $('countdownOverlay');
    const colors = [game.color || 'var(--electric-blue)', 'var(--banana-yellow)', 'var(--acid-green)'];
    let n = 3;
    el.innerHTML = `
        <div style="font-family:'Impact',sans-serif;font-size:clamp(1.2rem,3.5vw,2rem);color:${game.color};margin-bottom:10px;animation:slideDown 0.3s ease">${game.name}</div>
        <div class="countdown-text" style="color:${colors[0]}">${n}</div>
    `;
    el.classList.add('active');
    SFX.tick();
    const iv = setInterval(() => {
        n--;
        if (n > 0) {
            el.querySelector('.countdown-text').outerHTML = `<div class="countdown-text" style="color:${colors[3-n]}">${n}</div>`;
            SFX.tick();
        } else {
            el.querySelector('.countdown-text').outerHTML = `<div class="countdown-text" style="color:var(--acid-green)">GO!</div>`;
            SFX.go();
            clearInterval(iv);
            setTimeout(() => { el.classList.remove('active'); cb(); }, 300);
        }
    }, 500);
}

// ==========================================
// ANSWER HANDLING
// ==========================================
function answer(correct, timeout = false) {
    if (!G.answering) return;
    G.answering = false;
    stopTimer();

    if (correct) {
        G.correct++; G.combo++; G.streak++;
        if (G.combo > G.maxCombo) G.maxCombo = G.combo;
        if (G.streak > G.bestStreak) G.bestStreak = G.streak;
        const mult = 1 + Math.min(G.combo-1, CFG.maxCombo-1) * CFG.comboStep;
        const timeBonus = Math.floor((G.timeLeft / G.totalTime) * 60);
        const pts = Math.floor(CFG.basePoints * mult) + timeBonus;
        G.score += pts;
        SFX.correct();
        if (G.combo >= 3) SFX.combo();
        bg.burst(innerWidth/2, innerHeight/2, '#76ff03', 18);
        floatPts('+' + pts, 'var(--acid-green)');
        showResult(true, pts);
        screenFlash('rgba(118,255,3,0.12)');
    } else {
        G.wrong++; G.combo = 0; G.streak = 0; G.lives--;
        SFX.wrong();
        bg.burst(innerWidth/2, innerHeight/2, '#ff1744', 12);
        showResult(false);
        screenShake(10, 400);
        screenFlash('rgba(255,23,68,0.15)');
    }
    updateHUD();
}

function showResult(ok, pts) {
    const el = $('resultOverlay');
    const winEmoji = pick(['🎉','🥳','🤩','💥','⚡','🔥','✨','💫','🌟','🎊','💯','🏆','👑','🦄']);
    const loseEmoji = pick(['😵','💀','🤦','😱','🙈','💔','😤','🫠','😭','🤡','👻','😬']);
    const winText = pick(['NICE!','BONKERS!','SICK!','YOOO!','LEGENDARY!','UNREAL!','SMOOTH!','NAILED IT!','INSANE!','PERFECT!','WILD!','GODLIKE!','SHEESH!','ABSOLUTE UNIT!']);
    const loseText = pick(['OOPS!','YIKES!','BRUH!','NOPE!','SPLAT!','BONKED!','WRECKED!','FUMBLED!','RIP!','DESTROYED!']);

    el.style.background = ok ? 'rgba(118,255,3,0.08)' : 'rgba(255,23,68,0.08)';

function floatPts(text, color) {
    const el = document.createElement('div');
    el.className = 'float-pts'; el.textContent = text; el.style.color = color;
    el.style.left = (innerWidth/2-40)+'px'; el.style.top = (innerHeight/2-60)+'px';
    el.style.animation = 'floatUp 0.8s ease-out forwards';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);
}

function screenFlash(c) {
    const f = document.createElement('div');
    f.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:${c};z-index:350;pointer-events:none;opacity:1;transition:opacity 0.3s`;
    document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.opacity = '0'; setTimeout(() => f.remove(), 300); });
}

function screenShake(intensity, dur) {
    const c = $('gameScreen'); const t0 = Date.now();
    (function s() {
        const e = Date.now()-t0;
        if (e > dur) { c.style.transform = ''; return; }
        const d = 1-e/dur;
        c.style.transform = `translate(${(Math.random()-0.5)*intensity*d*2}px,${(Math.random()-0.5)*intensity*d*2}px)`;
        requestAnimationFrame(s);
    })();
}

// ==========================================
// GAME OVER
// ==========================================
function gameOver(completed = false) {
    stopTimer(); G.answering = false;
    const tot = G.correct + G.wrong;
    const acc = tot > 0 ? Math.round((G.correct/tot)*100) : 0;
    const secs = Math.floor((Date.now()-G.startTime)/1000);
    const m = Math.floor(secs/60), s = secs%60;

    let rank, rc, re;
    if (acc >= 95 && G.score >= 4000) { rank='S+'; rc='linear-gradient(135deg,#ffd700,#ff8c00)'; re='👑'; }
    else if (acc >= 85 && G.score >= 2500) { rank='S'; rc='linear-gradient(135deg,#ffd700,#ffea00)'; re='🏆'; }
    else if (acc >= 75 && G.score >= 1500) { rank='A'; rc='linear-gradient(135deg,#76ff03,#00e676)'; re='⭐'; }
    else if (acc >= 60 && G.score >= 800) { rank='B'; rc='linear-gradient(135deg,#00e5ff,#0091ea)'; re='💎'; }
    else if (acc >= 40) { rank='C'; rc='linear-gradient(135deg,#ff6d00,#e65100)'; re='🔥'; }
    else { rank='D'; rc='linear-gradient(135deg,#ff1493,#d500f9)'; re='💪'; }

    if (completed) { SFX.victory(); bg.confetti(80); }
    else SFX.gameOver();

    $('goContent').innerHTML = `
        <div class="gameover-title" style="color:${completed?'var(--acid-green)':'var(--hot-pink)'}">
            ${completed ? 'YOU WIN!' : 'GAME OVER!'}
        </div>
        <div style="color:rgba(255,255,255,0.4);margin-bottom:15px">${completed ? 'All rounds cleared!' : `Made it to Round ${G.round}`}</div>
        <div class="rank-display" style="background:${rc};color:#000">${re} RANK ${rank} ${re}</div>
        <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.3)">SCORE</div>
        <div class="final-score-num">${G.score.toLocaleString()}</div>
        <div class="stats-row">
            <div class="stat-box"><div class="stat-num" style="color:var(--acid-green)">${G.correct}</div><div class="stat-lbl">Wins</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--lava-red)">${G.wrong}</div><div class="stat-lbl">Fails</div></div>
            <div class="stat-box"><div class="stat-num">${acc}%</div><div class="stat-lbl">Accuracy</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--vivid-orange)">${G.maxCombo}x</div><div class="stat-lbl">Combo</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--banana-yellow)">${G.bestStreak}</div><div class="stat-lbl">Streak</div></div>
            <div class="stat-box"><div class="stat-num">${m}:${s.toString().padStart(2,'0')}</div><div class="stat-lbl">Time</div></div>
        </div>
        <div class="go-buttons">
            <button class="btn btn-play" style="padding:16px 40px;font-size:1.1rem" onclick="startGame()">AGAIN!</button>
            <button class="btn btn-alt" onclick="showLB()">SCORES</button>
            <button class="btn btn-fire" onclick="showScreen('titleScreen')">MENU</button>
        </div>
    `;
    saveScore({ score: G.score, rank, acc, round: G.round, date: new Date().toLocaleDateString() });
    showScreen('gameOverScreen');
}

// ==========================================
// MICRO-GAME: DODGE!
// ==========================================
function mgDodge() {
    return {
        name: 'DODGE EVERYTHING!',
        color: 'var(--lava-red)',
        start() {
            clearArea();
            setInstruction('DODGE!', 'var(--lava-red)');
            const b = getAreaBounds();
            const player = document.createElement('div');
            player.className = 'player-char';
            player.textContent = '🏃';
            let px = b.w / 2, py = b.h - 80;
            player.style.left = px + 'px';
            player.style.top = py + 'px';
            area().appendChild(player);

            const obstacles = [];
            const dangerEmojis = ['🔥','💣','🌩️','☄️','🪨','⚡','🦈','🌋'];

            // Mouse/touch control
            const move = (ex, ey) => {
                const r = area().getBoundingClientRect();
                px = clamp(ex - r.left - 20, 0, b.w - 40);
                py = clamp(ey - r.top - 20, 40, b.h - 40);
                player.style.left = px + 'px';
                player.style.top = py + 'px';
            };
            area().onmousemove = e => move(e.clientX, e.clientY);
            area().ontouchmove = e => { e.preventDefault(); move(e.touches[0].clientX, e.touches[0].clientY); };

            let survived = true;
            let spawnRate = 250;

            const spawnObs = () => {
                if (!G.answering || G.paused) return;
                const o = document.createElement('div');
                o.className = 'obstacle';
                o.textContent = pick(dangerEmojis);
                o.style.left = R(0, b.w - 30) + 'px';
                o.style.top = '-30px';
                o._vy = RF(2, 5);
                area().appendChild(o);
                obstacles.push(o);
                setTimeout(spawnObs, spawnRate);
            };
            setTimeout(spawnObs, 300);

            startLoop(() => {
                obstacles.forEach(o => {
                    const oy = parseFloat(o.style.top) + o._vy;
                    o.style.top = oy + 'px';
                    if (oy > b.h) { o.remove(); return; }
                    // Collision
                    const ox = parseFloat(o.style.left);
                    if (dist(px+15, py+15, ox+15, oy+15) < 35) {
                        survived = false;
                        answer(false);
                    }
                });
            }, 16);

            // Survive = success (timer handles it via special flag)
            this._onTimeout = () => survived;
        }
    };
}

// Override answer for dodge-type games (survive = win)
const _dodgeAnswer = answer;
answer = function(correct, timeout = false) {
    stopLoop();
    if (timeout && G.current && G.current._onTimeout) {
        const result = G.current._onTimeout();
        _dodgeAnswer(result, false);
    } else {
        _dodgeAnswer(correct, timeout);
    }
};

function mgWhackAMole() {
    const target = R(3, 5);
    let whacked = 0;

    return {
        name: `WHACK ${target} MOLES!`,
        color: 'var(--banana-yellow)',
        start() {
            clearArea();
            setInstruction(`WHACK ${target}!`, 'var(--banana-yellow)');
            const grid = document.createElement('div');
            grid.className = 'mole-grid';
            grid.style.marginTop = '50px';
            const holes = [];

            for (let i = 0; i < 9; i++) {
                const hole = document.createElement('div');
                hole.className = 'mole-hole';
                const mole = document.createElement('span');
                mole.className = 'mole-emoji';
                mole.textContent = pick(['🐹','🐿️','🦔','🐰']);
                hole.appendChild(mole);
                hole.onclick = function() {
                    if (this.classList.contains('up')) {
                        this.classList.remove('up');
                        SFX.pop();
                        whacked++;
                        bg.burst(this.getBoundingClientRect().left+30, this.getBoundingClientRect().top+30, '#ffea00', 6);
                        if (whacked >= target) answer(true);
                    }
                };
                grid.appendChild(hole);
                holes.push(hole);
            }
            area().appendChild(grid);

            // Pop up moles
            const popUp = () => {
                if (!G.answering) return;
                const available = holes.filter(h => !h.classList.contains('up'));
                if (available.length === 0) return;
                const h = pick(available);
                h.classList.add('up');
                setTimeout(() => h.classList.remove('up'), R(600, 1200));

// ==========================================
// MICRO-GAME: CATCH FALLING ITEMS
// ==========================================
function mgCatchFalling() {
    const target = R(3, 5);
    let caught = 0;

    return {
        name: `CATCH ${target}!`,
        color: 'var(--electric-blue)',
        start() {
            clearArea();
            setInstruction(`CATCH ${target}!`, 'var(--electric-blue)');
            const b = getAreaBounds();
            const catcher = document.createElement('div');
            catcher.className = 'catcher';
            catcher.textContent = '🧺';
            let cx = b.w / 2;
            catcher.style.left = cx + 'px';
            area().appendChild(catcher);

            const move = ex => {
                const r = area().getBoundingClientRect();
                cx = clamp(ex - r.left - 20, 0, b.w - 40);
                catcher.style.left = cx + 'px';
            };
            area().onmousemove = e => move(e.clientX);
            area().ontouchmove = e => { e.preventDefault(); move(e.touches[0].clientX); };

            const items = [];
            const goodEmojis = ['⭐','🍎','💎','🍕','🎁','🍩','🧁'];
            const badEmojis = ['💣','🔥','💀','🗑️'];

            const spawn = () => {
                if (!G.answering) return;
                const isGood = Math.random() > 0.25;
                const item = document.createElement('div');
                item.className = 'falling-item';
                item.textContent = isGood ? pick(goodEmojis) : pick(badEmojis);
                item.style.left = R(10, b.w - 40) + 'px';
                item.style.top = '0px';
                item._vy = RF(2, 4);
                item._good = isGood;
                area().appendChild(item);
                items.push(item);
                setTimeout(spawn, R(300, 600));
            };
            spawn();

            startLoop(() => {
                for (let i = items.length - 1; i >= 0; i--) {
                    const it = items[i];
                    const iy = parseFloat(it.style.top) + it._vy;
                    it.style.top = iy + 'px';
                    const ix = parseFloat(it.style.left);

                    // Check catch
                    if (iy > b.h - 70 && Math.abs(ix - cx) < 45) {
                        it.remove();
                        items.splice(i, 1);
                        if (it._good) {
                            caught++;
                            SFX.pop();
                            if (caught >= target) answer(true);
                        } else {
                            SFX.boom();
                            answer(false);
                        }
                        continue;
                    }
                    if (iy > b.h + 30) { it.remove(); items.splice(i, 1); }
                }
            }, 16);
        }
    };
}

// ==========================================
// MICRO-GAME: SHAKE IT!
// ==========================================
function mgShakeIt() {
    let shakeAmount = 0;
    const target = 100;
    let lastX = 0, lastY = 0;

    return {
        name: 'SHAKE YOUR DEVICE!',
        color: 'var(--vivid-orange)',
        start() {
            clearArea();
            setInstruction('SHAKE / WIGGLE MOUSE!', 'var(--vivid-orange)');

            const meter = document.createElement('div');
            meter.className = 'shake-meter';
            meter.style.marginTop = '80px';
            const fill = document.createElement('div');
            fill.className = 'shake-fill';
            fill.style.width = '0%';
            fill.style.background = 'linear-gradient(90deg, var(--vivid-orange), var(--lava-red))';
            meter.appendChild(fill);
            area().appendChild(meter);

            const label = document.createElement('div');
            label.style.cssText = 'font-family:"Impact",sans-serif;font-size:2rem;margin-top:20px;color:var(--vivid-orange)';
            label.textContent = '0%';
            area().appendChild(label);

            const emoji = document.createElement('div');
            emoji.style.cssText = 'font-size:4rem;margin-top:15px';
            emoji.textContent = '📱';
            area().appendChild(emoji);

            // Track mouse movement speed
            const onMove = e => {
                const dx = Math.abs(e.clientX - lastX);
                const dy = Math.abs(e.clientY - lastY);
                shakeAmount += (dx + dy) * 0.15;
                lastX = e.clientX; lastY = e.clientY;
                const pct = Math.min(100, (shakeAmount / target) * 100);
                fill.style.width = pct + '%';
                label.textContent = Math.floor(pct) + '%';
                emoji.style.animation = 'megaShake 0.2s ease infinite';
                if (shakeAmount >= target) answer(true);
            };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', e => {
                onMove({ clientX: e.touches[0].clientX, clientY: e.touches[0].clientY });
            });

            // Device motion for actual shaking
            if (window.DeviceMotionEvent) {
                const onMotion = e => {
                    const a = e.accelerationIncludingGravity;
                    if (a) {
                        shakeAmount += (Math.abs(a.x||0) + Math.abs(a.y||0)) * 0.5;
                        const pct = Math.min(100, (shakeAmount / target) * 100);
                        fill.style.width = pct + '%';
                        label.textContent = Math.floor(pct) + '%';
                        if (shakeAmount >= target) answer(true);
                    }
                };
                window.addEventListener('devicemotion', onMotion);
            }
        }
    };
}

// MICRO-GAME: ORDER EMOJIS

function mgOrderEmojis() {
    const sets = [
        { hint: 'SMALLEST TO BIGGEST', items: ['🐜','🐱','🐘','🦕'], order: [0,1,2,3] },
        { hint: 'COLDEST TO HOTTEST', items: ['🧊','❄️','☀️','🔥'], order: [0,1,2,3] },
        { hint: 'SLOWEST TO FASTEST', items: ['🐌','🚶','🏎️','🚀'], order: [0,1,2,3] },
        { hint: 'YOUNGEST TO OLDEST', items: ['👶','🧒','👨','👴'], order: [0,1,2,3] },
        { hint: 'LIGHTEST TO HEAVIEST', items: ['🪶','📱','🎸','🏋️'], order: [0,1,2,3] }
    ];

    const set = pick(sets);
    const shuffled = shuffle(set.items.map((item, i) => ({ item, correctPos: i })));
    let selected = [];

    return {
        name: set.hint + '!',
        color: 'var(--mint)',
        start() {
            clearArea();
            setInstruction(set.hint, 'var(--mint)');

            const grid = document.createElement('div');
            grid.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:60px';

            shuffled.forEach((s, idx) => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.style.width = 'clamp(65px, 18vw, 90px)';
                card.style.height = 'clamp(65px, 18vw, 90px)';
                card.textContent = s.item;
                card.onclick = function() {
                    if (this.classList.contains('correct')) return;
                    const expectedPos = selected.length;
                    if (s.correctPos === expectedPos) {
                        this.classList.add('correct');
                        selected.push(s.correctPos);
                        SFX.pop();
                        if (selected.length === set.items.length) answer(true);
                    } else {
                        this.classList.add('wrong');
                        setTimeout(() => this.classList.remove('wrong'), 300);
                        answer(false);
                    }
                };
                grid.appendChild(card);
            });
            area().appendChild(grid);

            const hint = document.createElement('div');
            hint.style.cssText = 'font-size:0.9rem;color:rgba(255,255,255,0.4);margin-top:15px';
            hint.textContent = 'Tap in order!';
            area().appendChild(hint);
        }
    };
}

                    if (playerIdx >= sequence.length) return;
                    btn.classList.add('lit');
                    setTimeout(() => btn.classList.remove('lit'), 200);
                    SFX.play(300 + i * 100, 0.1, 'sine', 0.2);

                    if (sequence[playerIdx] === i) {
                        playerIdx++;
                        if (playerIdx >= sequence.length) answer(true);
                    } else {
                        answer(false);
                    }
                };
                grid.appendChild(btn);
                btns.push(btn);
            });
            area().appendChild(grid);

            // Play sequence
            const disableAll = () => btns.forEach(b => b.style.pointerEvents = 'none');
            const enableAll = () => btns.forEach(b => b.style.pointerEvents = '');
            disableAll();

            sequence.forEach((si, idx) => {
                setTimeout(() => {
                    btns[si].classList.add('lit');
                    SFX.play(300 + si * 100, 0.15, 'sine', 0.2);
                    setTimeout(() => btns[si].classList.remove('lit'), 300);
                }, idx * 500 + 500);
            });

            setTimeout(() => {
                if (!G.answering) return;
                setInstruction('YOUR TURN!', 'var(--banana-yellow)');
                enableAll();
            }, sequence.length * 500 + 800);
        }
    };
}

function mgBalancePlate() {
    return {
        name: 'KEEP IT BALANCED!',
        color: 'var(--mint)',
        _onTimeout: () => true,
        start() {
            clearArea();
            setInstruction('KEEP THE PLATE BALANCED!', 'var(--mint)');
            const b = getAreaBounds();

            const plate = document.createElement('div');
            plate.style.cssText = 'position:absolute;font-size:4rem;transition:left 0.05s,transform 0.1s';
            plate.textContent = '🍽️';
            let px = b.w / 2, tilt = 0, vel = 0;
            plate.style.left = px + 'px';
            plate.style.top = (b.h / 2 - 20) + 'px';
            area().appendChild(plate);

            area().onmousemove = e => {
                const r = area().getBoundingClientRect();
                px = e.clientX - r.left;
            };
            area().ontouchmove = e => {
                e.preventDefault();
                const r = area().getBoundingClientRect();
                px = e.touches[0].clientX - r.left;
            };

            startLoop(() => {
                const center = b.w / 2;
                const diff = (px - center) / center;
                tilt = diff * 30;
                vel += diff * 0.3 + (Math.random() - 0.5) * 0.5;
                const currentLeft = parseFloat(plate.style.left);
                const newLeft = clamp(currentLeft + vel, 20, b.w - 60);
                plate.style.left = newLeft + 'px';
                plate.style.transform = `rotate(${tilt}deg)`;

                if (newLeft <= 25 || newLeft >= b.w - 65) {
                    answer(false);
                }
            }, 30);
        }
    };
}

        this.unlocked = this.load();
        this.queue = [];
    }
    load() { try { return JSON.parse(localStorage.getItem('bb_ach')||'[]'); } catch { return []; } }
    save() { localStorage.setItem('bb_ach', JSON.stringify(this.unlocked)); }
    check() {
        for (const a of this.defs) {
            if (!this.unlocked.includes(a.id)) {
                try { if (a.check()) { this.unlocked.push(a.id); this.save(); this.queue.push(a); } } catch(e) {}
            }
        }
        this.showQueue();
    }
    showQueue() {
        if (!this.queue.length) return;
        const a = this.queue.shift();
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:65px;right:15px;z-index:800;
            background:linear-gradient(135deg,rgba(255,234,0,0.95),rgba(255,140,0,0.95));
            color:#000;padding:14px 18px;border-radius:14px;font-weight:700;font-size:0.9rem;
            box-shadow:0 4px 25px rgba(255,234,0,0.4);max-width:280px;
            animation:slideDown 0.4s ease;z-index:800;`;
        el.innerHTML = `<div style="font-size:1.3rem;margin-bottom:3px">${a.icon} ACHIEVEMENT!</div>
            <div style="font-size:1rem">${a.name}</div>
            <div style="font-size:0.75rem;opacity:0.7">${a.desc}</div>`;
        document.body.appendChild(el);
        SFX.init(); SFX.victory();
        bg.confetti(15);
        setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.5s'; setTimeout(()=>{el.remove();this.showQueue();},500); }, 2500);
    }
    count() { return this.unlocked.length; }
    total() { return this.defs.length; }
    renderList() {
        return this.defs.map(a => {
            const u = this.unlocked.includes(a.id);
            return `<div style="display:flex;gap:10px;align-items:center;padding:9px 14px;
                background:${u?'rgba(255,234,0,0.08)':'rgba(255,255,255,0.02)'};
                border:1px solid ${u?'rgba(255,234,0,0.2)':'rgba(255,255,255,0.04)'};
                border-radius:10px;margin-bottom:5px">
                <span style="font-size:1.4rem;opacity:${u?1:0.25}">${a.icon}</span>
                <div style="flex:1">
                    <div style="font-weight:700;color:${u?'#ffd700':'#444'};font-size:0.9rem">${a.name}</div>
                    <div style="font-size:0.75rem;color:${u?'#999':'#333'}">${a.desc}</div>
                </div>
                ${u?'<span style="color:#ffd700">&#10003;</span>':'<span style="color:#333">🔒</span>'}
            </div>`;
        }).join('');
    }
}

let allTimeStats = (function() {

    localStorage.setItem('bb_stats', JSON.stringify(allTimeStats));
}

function recordAllTimeGame() {
    if (!allTimeStats.totalGames) allTimeStats.totalGames = 0;
    if (!allTimeStats.totalCorrect) allTimeStats.totalCorrect = 0;
    if (!allTimeStats.totalWrong) allTimeStats.totalWrong = 0;
    if (!allTimeStats.totalScore) allTimeStats.totalScore = 0;
    if (!allTimeStats.gamesPlayed) allTimeStats.gamesPlayed = 0;
    if (!allTimeStats.bestScore) allTimeStats.bestScore = 0;
    if (!allTimeStats.bestCombo) allTimeStats.bestCombo = 0;
    if (!allTimeStats.bestStreak) allTimeStats.bestStreak = 0;

    allTimeStats.gamesPlayed++;
    allTimeStats.totalGames += G.totalGames;
    allTimeStats.totalCorrect += G.correct;
    allTimeStats.totalWrong += G.wrong;
    allTimeStats.totalScore += G.score;
    if (G.score > allTimeStats.bestScore) allTimeStats.bestScore = G.score;
    if (G.maxCombo > allTimeStats.bestCombo) allTimeStats.bestCombo = G.maxCombo;
    if (G.bestStreak > allTimeStats.bestStreak) allTimeStats.bestStreak = G.bestStreak;
    saveAllTimeStats();
}

// ==========================================
// SPEED RUN MODE
// ==========================================
class SpeedRunMode {
    constructor() { this.active = false; this.target = 0; this.startTime = 0; }
    start(target = 20) {
        SFX.init(); SFX.whoosh();
        this.active = true; this.target = target; this.startTime = Date.now();
        G = { score:0,lives:999,round:1,gameNum:0,totalGames:0,combo:0,maxCombo:0,
              streak:0,bestStreak:0,correct:0,wrong:0,paused:false,answering:false,
              timer:null,timeLeft:0,totalTime:0,current:null,startTime:Date.now() };
        CFG.gamesPerRound = 999; CFG.maxRounds = 999;
        showScreen('gameScreen'); updateHUD();

        // Add speedrun counter
        this.counterEl = document.createElement('div');
        this.counterEl.style.cssText = `position:fixed;top:65px;left:50%;transform:translateX(-50%);
            z-index:200;font-family:'Impact',sans-serif;font-size:1.2rem;color:var(--electric-blue);
            background:rgba(0,0,0,0.6);padding:6px 16px;border-radius:20px;
            border:1px solid rgba(0,229,255,0.3)`;
        this.counterEl.textContent = `0 / ${target}`;
        document.body.appendChild(this.counterEl);

        // Global timer
        this.timerEl = document.createElement('div');
        this.timerEl.style.cssText = `position:fixed;top:65px;right:15px;z-index:200;
            font-family:'Impact',sans-serif;font-size:1.5rem;color:var(--banana-yellow);
            background:rgba(0,0,0,0.6);padding:6px 14px;border-radius:10px`;
        document.body.appendChild(this.timerEl);

        this.timerInterval = setInterval(() => {
            const elapsed = ((Date.now() - this.startTime) / 1000).toFixed(1);
            if (this.timerEl) this.timerEl.textContent = elapsed + 's';
        }, 100);

        const el = $('roundOverlay');
        el.innerHTML = `
            <div style="font-size:4rem;animation:spin 1s ease">⏱️</div>
            <div class="round-text" style="color:var(--banana-yellow)">SPEED RUN!</div>
            <div class="round-speed" style="color:var(--electric-blue)">Get ${target} correct ASAP!</div>`;
        el.classList.add('active');
        setTimeout(() => { el.classList.remove('active'); nextGame(); }, 1800);
    }
    update() {
        if (!this.active) return;
        if (this.counterEl) this.counterEl.textContent = `${G.correct} / ${this.target}`;
        if (G.correct >= this.target) this.finish();
    }
    finish() {
        this.active = false;
        const time = ((Date.now() - this.startTime) / 1000).toFixed(1);
        if (this.timerInterval) clearInterval(this.timerInterval);
        if (this.counterEl) this.counterEl.remove();
        if (this.timerEl) this.timerEl.remove();
        CFG.gamesPerRound = 5; CFG.maxRounds = 15;
        stopTimer(); G.answering = false;

        // Save speedrun score
        try {
            const runs = JSON.parse(localStorage.getItem('bb_speedruns')||'[]');
            runs.push({ target: this.target, time: parseFloat(time), date: new Date().toLocaleDateString() });
            runs.sort((a,b) => a.time - b.time);
            if (runs.length > 10) runs.length = 10;
            localStorage.setItem('bb_speedruns', JSON.stringify(runs));
        } catch(e) {}

        SFX.victory(); bg.confetti(50);
        $('goContent').innerHTML = `
            <div class="gameover-title" style="color:var(--banana-yellow)">SPEED RUN COMPLETE!</div>
            <div style="color:rgba(255,255,255,0.5);margin-bottom:15px">${this.target} correct answers</div>
            <div class="final-score-num">${time}s</div>
            <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:3px;color:rgba(255,255,255,0.3);margin-bottom:15px">YOUR TIME</div>
            <div class="stats-row">
                <div class="stat-box"><div class="stat-num" style="color:var(--acid-green)">${G.correct}</div><div class="stat-lbl">Correct</div></div>
                <div class="stat-box"><div class="stat-num" style="color:var(--lava-red)">${G.wrong}</div><div class="stat-lbl">Wrong</div></div>
                <div class="stat-box"><div class="stat-num" style="color:var(--vivid-orange)">${G.maxCombo}x</div><div class="stat-lbl">Combo</div></div>
            </div>
            <div class="go-buttons">
                <button class="btn btn-play" style="padding:14px 35px;font-size:1rem" onclick="speedRun.start(${this.target})">RETRY</button>
                <button class="btn btn-neon" onclick="showModes()">MODES</button>
                <button class="btn btn-fire" onclick="showScreen('titleScreen')">MENU</button>
            </div>`;
        showScreen('gameOverScreen');
    }
    stop() {
        this.active = false;
        if (this.timerInterval) clearInterval(this.timerInterval);
        if (this.counterEl) this.counterEl.remove();
        if (this.timerEl) this.timerEl.remove();
        CFG.gamesPerRound = 5; CFG.maxRounds = 15;
    }
}

class PowerUps {
    constructor() { this.cooldowns = {}; }
    check() {
        if (G.streak === 7 && !this.cooldowns.life) {
            this.cooldowns.life = true;
            this.award('EXTRA LIFE!', '❤️', 'var(--lava-red)', () => { G.lives = Math.min(G.lives+1, CFG.maxLives); updateHUD(); });
        }
        if (G.combo === 5 && !this.cooldowns.time) {
            this.cooldowns.time = true;
            this.award('TIME WARP!', '⏰', 'var(--electric-blue)', () => { G.totalTime += 3000; });
        }
        if (G.streak === 12 && !this.cooldowns.shield) {
            this.cooldowns.shield = true;
            this.award('SHIELD!', '🛡️', 'var(--mint)', () => { /* next wrong = free pass */ });
        }
    }
    award(name, icon, color, effect) {
        effect();
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:350;
            background:${color};color:#fff;padding:18px 35px;border-radius:16px;
            font-family:'Impact',sans-serif;font-size:1.3rem;text-align:center;
            animation:popIn 0.4s ease;box-shadow:0 0 30px ${color};z-index:350`;
        el.innerHTML = `<div style="font-size:2.5rem;margin-bottom:4px">${icon}</div>${name}`;

// WACKY TRANSITION EFFECTS
// ==========================================
class WackyTransitions {
    static random() {
        const effects = [this.wipe, this.circles, this.pixelate, this.zoom, this.spiral];
        pick(effects).call(this);
    }

    static wipe() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:0;left:-100%;width:100%;height:100%;
            background:linear-gradient(135deg,var(--hot-pink),var(--psycho-purple));z-index:650;
            transition:left 0.3s ease-in-out;pointer-events:none`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
            el.style.left = '0';
            setTimeout(() => { el.style.left = '100%'; setTimeout(() => el.remove(), 300); }, 200);
        });
    }

    static circles() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:50%;left:50%;width:0;height:0;
            border-radius:50%;background:var(--electric-blue);z-index:650;
            transform:translate(-50%,-50%);transition:all 0.3s ease;pointer-events:none`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
            el.style.width = '200vmax'; el.style.height = '200vmax';
            setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 200);
        });
    }

    static pixelate() {
        const count = 20;
        for (let i = 0; i < count; i++) {
            const el = document.createElement('div');
            el.style.cssText = `position:fixed;z-index:650;pointer-events:none;border-radius:4px;
                left:${Math.random()*100}%;top:${Math.random()*100}%;
                width:${R(30,80)}px;height:${R(30,80)}px;
                background:hsl(${R(0,360)},80%,60%);
                animation:popIn 0.2s ease ${i*0.02}s both;
                opacity:0.8`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 400);
        }
    }

    static zoom() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:50%;left:50%;z-index:650;pointer-events:none;
            font-size:8rem;transform:translate(-50%,-50%) scale(0);
            animation:firework 0.5s ease forwards`;
        el.textContent = pick(['💥','⚡','🔥','✨','💫','🌟','🎆','🎇']);
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 500);
    }

    static spiral() {
        for (let i = 0; i < 12; i++) {
            const el = document.createElement('div');
            const angle = (Math.PI*2/12)*i;
            const r = 100;
            el.style.cssText = `position:fixed;z-index:650;pointer-events:none;font-size:2rem;
                left:${50+Math.cos(angle)*r/innerWidth*100}%;
                top:${50+Math.sin(angle)*r/innerHeight*100}%;
                transform:translate(-50%,-50%);
                animation:firework 0.6s ease ${i*0.03}s both`;
            el.textContent = '✨';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 700);
        }
    }
}

class Announcer {
    static shout(text, color, duration = 800) {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);
            font-family:'Impact',sans-serif;font-size:clamp(2rem,8vw,4rem);
            color:${color};text-shadow:0 0 20px ${color},0 4px 10px rgba(0,0,0,0.5);
            z-index:400;pointer-events:none;white-space:nowrap;
            animation:zoomSpin 0.3s ease;letter-spacing:3px`;
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, duration);
    }

    static comboCallout(combo) {
        if (combo === 3) this.shout('TRIPLE!', 'var(--vivid-orange)');
        else if (combo === 5) this.shout('PENTA KILL!', 'var(--lava-red)');
        else if (combo === 7) this.shout('GODLIKE!', 'var(--psycho-purple)');
        else if (combo === 10) this.shout('BEYOND BONKERS!', 'var(--banana-yellow)');
        else if (combo >= 15) this.shout('IMPOSSIBLE!!', '#fff', 1200);
    }

    static streakCallout(streak) {
        if (streak === 5) this.shout('🔥 ON FIRE!', 'var(--vivid-orange)');
        else if (streak === 10) this.shout('⚡ UNSTOPPABLE!', 'var(--electric-blue)');
        else if (streak === 15) this.shout('🌟 LEGENDARY!', 'var(--banana-yellow)', 1000);
        else if (streak === 20) this.shout('👑 GODMODE!', '#fff', 1200);
    }
}

                    if (dx > b.w + 100) duck.remove();
                    else requestAnimationFrame(fly);
                };
                fly();

                setTimeout(spawnDuck, R(400, 900));
            };
            spawnDuck();
        }
    };
}

function mgTightrope() {
    return {
        name: 'WALK THE TIGHTROPE!',
        color: 'var(--electric-blue)',
        _onTimeout: () => true,
        start() {
            clearArea();
            setInstruction('STAY ON THE LINE!', 'var(--electric-blue)');
            const b = getAreaBounds();

            // Tightrope
            const rope = document.createElement('div');
            rope.style.cssText = `position:absolute;top:${b.h/2}px;left:0;right:0;height:4px;background:rgba(255,255,255,0.3);z-index:5`;
            area().appendChild(rope);

            // Walker
            const walker = document.createElement('div');
            walker.style.cssText = 'position:absolute;font-size:2.5rem;z-index:10;transition:top 0.05s';
            walker.textContent = '🤸';
            let wx = 50, wy = b.h / 2 - 20;
            walker.style.left = wx + 'px';
            walker.style.top = wy + 'px';
            area().appendChild(walker);

            area().onmousemove = e => {
                const r = area().getBoundingClientRect();
                wy = e.clientY - r.top - 15;
                walker.style.top = wy + 'px';
            };
            area().ontouchmove = e => {
                e.preventDefault();
                const r = area().getBoundingClientRect();
                wy = e.touches[0].clientY - r.top - 15;
                walker.style.top = wy + 'px';
            };

            startLoop(() => {
                wx += 2;
                walker.style.left = wx + 'px';

                // Check if still on rope (within 40px of center)
                const ropeY = b.h / 2 - 20;
                if (Math.abs(wy - ropeY) > 50) {
                    answer(false);
                }
                if (wx > b.w - 50) {
                    answer(true);
                }
            }, 30);
        }
    };
}
