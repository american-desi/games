class BossBattle {
    constructor() {
        this.active = false;
        this.hp = 0;
        this.maxHp = 0;
        this.boss = null;
        this.bossRounds = [3, 6, 9, 12, 15];
        this.barEl = null;
    }

    isBossRound(round) { return this.bossRounds.includes(round); }

    getBoss(round) {
        const bosses = [
            { name: 'THE TICKLE MONSTER', emoji: '🤡', color: 'var(--hot-pink)', taunt: 'I\'ll tickle your brain!', hp: 4 },
            { name: 'CAPTAIN CHAOS', emoji: '🦹', color: 'var(--psycho-purple)', taunt: 'Chaos is my middle name!', hp: 5 },
            { name: 'DR. BONKENSTEIN', emoji: '🧟', color: 'var(--acid-green)', taunt: 'IT\'S ALIVE... AND ANGRY!', hp: 6 },
            { name: 'THE MEME LORD', emoji: '👾', color: 'var(--electric-blue)', taunt: 'Your reflexes are weak, mortal!', hp: 7 },
            { name: 'MEGA ULTRA BOSS', emoji: '🐲', color: 'var(--lava-red)', taunt: 'I AM THE FINAL BOSS!', hp: 8 }
        ];
        const idx = Math.min(this.bossRounds.indexOf(round), bosses.length - 1);
        return bosses[Math.max(0, idx)];
    }

    start(round) {
        this.boss = this.getBoss(round);
        this.hp = this.boss.hp;
        this.maxHp = this.boss.hp;
        this.active = true;
    }

    hit() {
        this.hp--;
        this.updateBar();
        screenShake(6, 200);
        bg.burst(innerWidth / 2, 100, this.boss.color.replace('var(--', '').replace(')', ''), 10);
        if (this.hp <= 0) {
            this.active = false;
            return true;
        }
        return false;
    }

    createBar() {
        if (this.barEl) this.barEl.remove();
        this.barEl = document.createElement('div');
        this.barEl.style.cssText = `position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
            width:80%;max-width:400px;z-index:50;text-align:center`;
        this.barEl.innerHTML = `
            <div style="font-weight:700;font-size:0.85rem;color:${this.boss.color};margin-bottom:4px">
                ${this.boss.emoji} ${this.boss.name} ${this.boss.emoji}
            </div>
            <div id="bossBarOuter" style="background:rgba(0,0,0,0.5);border-radius:6px;height:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.1)">
                <div id="bossBarInner" style="height:100%;width:100%;background:var(--lava-red);border-radius:6px;transition:width 0.3s"></div>
            </div>
            <div style="font-size:0.7rem;color:#666;margin-top:2px">${this.hp} / ${this.maxHp} HP</div>
        `;
        area().appendChild(this.barEl);
    }

    updateBar() {
        const inner = document.getElementById('bossBarInner');
        if (inner) {
            const pct = (this.hp / this.maxHp) * 100;
            inner.style.width = pct + '%';
            inner.style.background = pct > 50 ? 'var(--acid-green)' : pct > 25 ? 'var(--banana-yellow)' : 'var(--lava-red)';
        }
    }

    showIntro(cb) {
        const el = $('roundOverlay');
        el.innerHTML = `
            <div style="font-size:5rem;animation:wobble 1s ease infinite">${this.boss.emoji}</div>
            <div class="round-text" style="font-size:clamp(1.8rem,6vw,3.5rem);color:${this.boss.color}">BOSS BATTLE!</div>
            <div style="font-family:'Impact',sans-serif;font-size:clamp(1.2rem,4vw,2rem);color:#fff;margin:8px 0">${this.boss.name}</div>
            <div style="font-style:italic;color:#888">"${this.boss.taunt}"</div>
            <div style="font-size:0.9rem;color:var(--vivid-orange);margin-top:8px">Land ${this.maxHp} hits to defeat!</div>
        `;
        el.classList.add('active');
        SFX.boom();
        setTimeout(() => SFX.play(150, 0.4, 'sawtooth', 0.2), 200);
        setTimeout(() => { el.classList.remove('active'); cb(); }, 3000);
    }

    showVictory(cb) {
        const bonus = 500 * Math.ceil(G.round / 3);
        G.score += bonus;
        updateHUD();

        const el = $('roundOverlay');
        el.innerHTML = `
            <div style="font-size:5rem;animation:spin 1s ease">${this.boss.emoji}</div>
            <div class="round-text" style="color:var(--acid-green)">BOSS DEFEATED!</div>
            <div style="font-size:1.3rem;color:var(--banana-yellow);margin:8px 0">+${bonus} BONUS!</div>
            <div style="font-size:0.9rem;color:#888">${this.boss.name} was bonked!</div>
        `;
        el.classList.add('active');
        SFX.victory();
        bg.confetti(50);
        setTimeout(() => { el.classList.remove('active'); cb(); }, 2800);
    }
}

// Handle boss hits
const _bossAnswer = answer;
answer = function(correct, timeout = false) {
    if (boss.active && correct && !timeout && G.current && G.current.checkAnswer !== undefined) {
        // Not applicable for auto-check games
    }

    if (boss.active && correct) {
        const wasCorrect = !timeout;
        if (wasCorrect) {
            const defeated = boss.hit();
            if (defeated) {
                // Boss defeated!
                G.answering = false;
                stopTimer(); stopLoop();
                G.correct++; G.combo++; G.streak++;
                if (G.combo > G.maxCombo) G.maxCombo = G.combo;
                if (G.streak > G.bestStreak) G.bestStreak = G.streak;
                const mult = 1 + Math.min(G.combo-1, CFG.maxCombo-1) * CFG.comboStep;
                G.score += Math.floor(CFG.basePoints * mult);
                updateHUD();

                boss.showVictory(() => {
                    G.round++; G.gameNum = 0;
                    if (G.round > CFG.maxRounds) gameOver(true);
                    else { updateHUD(); showRound(); }
                });
                return;
            }
        }
    }

    _bossAnswer(correct, timeout);
};

class DailyChallenge {
    constructor() {
        this.seed = this.getSeed();
    }

    getSeed() {
        const d = new Date();
        return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate();
    }

    seededRand(s) {
        let x = Math.sin(s++) * 10000;
        return x - Math.floor(x);
    }

    hasPlayed() {
        return localStorage.getItem('bb_daily_seed') === this.seed.toString();
    }

    getScore() {
        return parseInt(localStorage.getItem('bb_daily_score') || '0');
    }

    recordScore(score) {
        localStorage.setItem('bb_daily_seed', this.seed.toString());
        localStorage.setItem('bb_daily_score', score.toString());
    }

    start() {
        SFX.init(); SFX.whoosh();
        G = { score:0,lives:3,round:1,gameNum:0,totalGames:0,combo:0,maxCombo:0,
              streak:0,bestStreak:0,correct:0,wrong:0,paused:false,answering:false,
              timer:null,timeLeft:0,totalTime:0,current:null,startTime:Date.now() };
        CFG.gamesPerRound = 8;
        CFG.maxRounds = 5;
        showScreen('gameScreen'); updateHUD();

        const el = $('roundOverlay');
        el.innerHTML = `
            <div style="font-size:4rem;animation:wobble 1.5s ease infinite">📅</div>
            <div class="round-text" style="color:var(--banana-yellow)">DAILY CHALLENGE</div>

        CFG.maxRounds = this.roundsPerPlayer;

class Settings {

        this.data = this.load();

        return {
            volume: 25,
            difficulty: 'normal',
            screenShake: true,
            particles: true,
            comboCallouts: true,
            transitions: true,
            livesCount: 4,
            gamesPerRound: 5,
            totalRounds: 15,
            timerSpeed: 'normal'
        };
    }

    load() {
        try { return { ...this.defaults(), ...JSON.parse(localStorage.getItem('bb_settings')||'{}') }; }
        catch { return this.defaults(); }
    }

    save() { localStorage.setItem('bb_settings', JSON.stringify(this.data)); this.apply(); }

    apply() {
        SFX.vol = this.data.volume / 100;

function mgRhythmTap() {
    let hits = 0;
    const target = R(4, 6);

    return {
        name: 'RHYTHM TAP!',
        color: 'var(--psycho-purple)',
        start() {
            clearArea();
            setInstruction('TAP WHEN NOTES REACH THE LINE!', 'var(--psycho-purple)');
            const b = getAreaBounds();

            // Beat line
            const line = document.createElement('div');
            line.style.cssText = `position:absolute;bottom:100px;left:0;right:0;height:3px;
                background:var(--psycho-purple);box-shadow:0 0 10px var(--psycho-purple)`;
            area().appendChild(line);

            // Hit zone
            const hitZone = document.createElement('div');
            hitZone.style.cssText = `position:absolute;bottom:80px;left:50%;transform:translateX(-50%);
                width:80px;height:40px;border:2px solid var(--psycho-purple);border-radius:10px;
                background:rgba(213,0,249,0.1);cursor:pointer;display:flex;align-items:center;
                justify-content:center;font-size:1.5rem;z-index:10`;
            hitZone.textContent = '🎵';
            area().appendChild(hitZone);

            const counter = document.createElement('div');
            counter.style.cssText = 'position:absolute;top:60px;left:50%;transform:translateX(-50%);font-family:"Impact",sans-serif;font-size:1.3rem;color:var(--psycho-purple)';
            counter.textContent = `${hits}/${target}`;
            area().appendChild(counter);

            // Notes fall from top
            const notes = [];
            const noteEmojis = ['🎵','🎶','♪','♫'];

            const spawnNote = () => {
                if (!G.answering) return;
                const note = document.createElement('div');
                note.style.cssText = `position:absolute;font-size:2rem;left:${b.w/2 - 15 + R(-30,30)}px;top:60px;z-index:5;
                    transition:none;pointer-events:none`;
                note.textContent = pick(noteEmojis);
                note._y = 60;
                note._speed = RF(2, 3.5);
                area().appendChild(note);
                notes.push(note);
                setTimeout(spawnNote, R(600, 1000));
            };
            spawnNote();

            hitZone.onclick = () => {
                // Check if any note is near the line
                let hitAny = false;
                for (let i = notes.length - 1; i >= 0; i--) {
                    const n = notes[i];
                    if (n._y > b.h - 140 && n._y < b.h - 70) {
                        hitAny = true;
                        n.textContent = '✨';
                        n.style.opacity = '0';
                        setTimeout(() => n.remove(), 200);
                        notes.splice(i, 1);
                        hits++;
                        SFX.play(300 + hits * 80, 0.08, 'sine', 0.2);
                        counter.textContent = `${hits}/${target}`;
                        if (hits >= target) answer(true);
                        break;
                    }
                }
                if (!hitAny) {
                    hitZone.style.animation = 'shake 0.2s ease';
                    setTimeout(() => hitZone.style.animation = '', 200);
                }
            };

            startLoop(() => {
                for (let i = notes.length - 1; i >= 0; i--) {
                    const n = notes[i];
                    n._y += n._speed;
                    n.style.top = n._y + 'px';
                    if (n._y > b.h + 20) {
                        n.remove();
                        notes.splice(i, 1);
                    }
                }
            }, 16);
        }
    };
}

function mgEmojiRain() {
    const target = pick(['🌟','💎','🍕','🎁','🍩']);
    const avoid = pick(['💣','☠️','🔥','💀','⚡'].filter(e => e !== target));
    let caught = 0;
    const goal = R(3, 5);

    return {
        name: `CATCH ${goal} ${target}!`,
        color: 'var(--acid-green)',
        start() {
            clearArea();
            setInstruction(`CATCH ${target} AVOID ${avoid}!`, 'var(--acid-green)');
            const b = getAreaBounds();

            area().onclick = e => {
                const r = area().getBoundingClientRect();
                const cx = e.clientX - r.left;
                const cy = e.clientY - r.top;

                // Check proximity to any falling item
                const items = area().querySelectorAll('.rain-item');
                items.forEach(item => {
                    const ix = parseFloat(item.style.left) + 15;
                    const iy = parseFloat(item.style.top) + 15;
                    if (dist(cx, cy, ix, iy) < 40) {
                        if (item.dataset.type === 'good') {
                            caught++;
                            SFX.pop();
                            item.textContent = '✨';
                            item.style.pointerEvents = 'none';
                            setTimeout(() => item.remove(), 150);
                            if (caught >= goal) answer(true);
                        } else {
                            SFX.boom();
                            answer(false);
                        }
                    }
                });
            };

            const spawn = () => {
                if (!G.answering) return;
                const isGood = Math.random() > 0.35;
                const item = document.createElement('div');
                item.className = 'rain-item';
                item.dataset.type = isGood ? 'good' : 'bad';
                item.style.cssText = `position:absolute;font-size:2rem;left:${R(10,b.w-30)}px;top:-30px;
                    pointer-events:none;z-index:5`;
                item.textContent = isGood ? target : avoid;
                item._vy = RF(1.5, 3.5);
                area().appendChild(item);
                setTimeout(spawn, R(200, 500));
            };
            spawn();

            startLoop(() => {
                area().querySelectorAll('.rain-item').forEach(item => {
                    const y = parseFloat(item.style.top) + (item._vy || 2);
                    item.style.top = y + 'px';
                    if (y > b.h + 20) item.remove();
                });
            }, 16);
        }
    };
}

function mgSizeSort() {
    const emojis = [
        { e: '🐜', size: 1 }, { e: '🐁', size: 2 }, { e: '🐱', size: 3 },
        { e: '🐕', size: 4 }, { e: '🦁', size: 5 }, { e: '🐘', size: 6 },
        { e: '🦕', size: 7 }, { e: '🏔️', size: 8 }, { e: '🌍', size: 9 }
    ];

    const count = R(3, 5);
    const selected = shuffle(emojis).slice(0, count);
    const sorted = [...selected].sort((a, b) => a.size - b.size);
    let idx = 0;

    return {
        name: 'SIZE ORDER!',
        color: 'var(--mint)',
        start() {
            clearArea();
            setInstruction('TAP SMALLEST TO BIGGEST!', 'var(--mint)');

            const progress = document.createElement('div');
            progress.id = 'sizeProgress';
            progress.style.cssText = 'display:flex;gap:6px;margin:50px 0 15px;min-height:40px;align-items:center;justify-content:center';
            area().appendChild(progress);

            const grid = document.createElement('div');
            grid.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;justify-content:center';

            shuffle(selected).forEach(item => {
                const btn = document.createElement('button');
                btn.style.cssText = `font-size:3rem;width:80px;height:80px;border:2px solid rgba(255,255,255,0.1);
                    border-radius:14px;background:rgba(255,255,255,0.04);cursor:pointer;transition:all 0.1s`;
                btn.textContent = item.e;
                btn.onmouseover = () => { btn.style.borderColor = 'var(--mint)'; btn.style.transform = 'scale(1.1)'; };
                btn.onmouseout = () => { btn.style.borderColor = 'rgba(255,255,255,0.1)'; btn.style.transform = ''; };
                btn.onclick = function() {
                    if (item.size === sorted[idx].size) {
                        idx++;
                        this.style.opacity = '0.3';
                        this.style.pointerEvents = 'none';
                        SFX.pop();
                        const prog = document.getElementById('sizeProgress');
                        if (prog) {
                            const placed = document.createElement('span');
                            placed.textContent = item.e;
                            placed.style.cssText = 'font-size:2rem;animation:popIn 0.2s ease';
                            prog.appendChild(placed);
                        }
                        if (idx >= sorted.length) answer(true);
                    } else {
                        answer(false);
                    }
                };
                grid.appendChild(btn);
            });
            area().appendChild(grid);
        }
    };
}

function mgLightsOut() {
    const size = 3;
    const grid_state = [];
    for (let i = 0; i < size * size; i++) grid_state.push(Math.random() > 0.5);

    // Make sure at least 2 are on
    let onCount = grid_state.filter(Boolean).length;
    while (onCount < 2) { grid_state[R(0, size*size-1)] = true; onCount = grid_state.filter(Boolean).length; }

    return {
        name: 'TURN OFF ALL LIGHTS!',
        color: 'var(--banana-yellow)',
        start() {
            clearArea();
            setInstruction('TURN ALL LIGHTS OFF!', 'var(--banana-yellow)');

            const grid = document.createElement('div');
            grid.style.cssText = `display:grid;grid-template-columns:repeat(${size},70px);gap:8px;justify-content:center;margin-top:60px`;
            const cells = [];

            const toggle = (idx) => {
                grid_state[idx] = !grid_state[idx];
                // Also toggle neighbors
                const row = Math.floor(idx / size), col = idx % size;
                if (row > 0) grid_state[idx - size] = !grid_state[idx - size];
                if (row < size - 1) grid_state[idx + size] = !grid_state[idx + size];
                if (col > 0) grid_state[idx - 1] = !grid_state[idx - 1];
                if (col < size - 1) grid_state[idx + 1] = !grid_state[idx + 1];
                updateCells();
                SFX.play(300 + R(0, 200), 0.05, 'sine', 0.15);
                if (grid_state.every(v => !v)) answer(true);
            };

            const updateCells = () => {
                cells.forEach((c, i) => {
                    c.style.background = grid_state[i] ? 'var(--banana-yellow)' : 'rgba(255,255,255,0.06)';
                    c.style.boxShadow = grid_state[i] ? '0 0 15px var(--banana-yellow)' : 'none';
                });
            };

            for (let i = 0; i < size * size; i++) {
                const cell = document.createElement('button');
                cell.style.cssText = `width:70px;height:70px;border-radius:12px;border:2px solid rgba(255,255,255,0.1);
                    cursor:pointer;transition:all 0.15s;font-size:1.5rem`;
                cell.onclick = () => toggle(i);
                grid.appendChild(cell);
                cells.push(cell);
            }
            area().appendChild(grid);
            updateCells();

            const hint = document.createElement('div');
            hint.style.cssText = 'font-size:0.8rem;color:#555;margin-top:12px';
            hint.textContent = 'Tapping toggles neighbors too!';
            area().appendChild(hint);
        }
    };
}

function mgEmojiMath() {
    // Not real math - just emoji logic
    const combos = [
        { a: '🐱', op: '+', b: '🏠', answer: '🐱🏠', wrong: ['🐕🏠','🐱🌳','🐕🌳'] },
        { a: '☀️', op: '+', b: '🌧️', answer: '🌈', wrong: ['⛈️','❄️','🌊'] },
        { a: '👨', op: '+', b: '🎸', answer: '🎸👨', wrong: ['🎹','🥁','🎵'] },
        { a: '🍞', op: '+', b: '🧀', answer: '🥪', wrong: ['🍕','🌮','🍔'] },
        { a: '✏️', op: '+', b: '📄', answer: '📝', wrong: ['📚','🖊️','📋'] }
    ];

    const combo = pick(combos);
    const choices = shuffle([combo.answer, ...combo.wrong]);

    return {
        name: 'EMOJI EQUATION!',
        color: 'var(--hot-pink)',
        start() {

            const grid = document.createElement('div');
            grid.className = 'match-grid';
            grid.style.gridTemplateColumns = 'repeat(2, clamp(80px, 22vw, 110px))';
            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.textContent = c;
                card.onclick = () => answer(c === combo.answer);

    startLevel(worldIdx, levelIdx) {
        this.active = true;
        this.currentWorld = worldIdx;
        this.currentLevel = levelIdx;
        const w = this.worlds[worldIdx];
        const isBoss = levelIdx === w.levels - 1;

        SFX.whoosh();
        G = {
            score: 0,
            lives: Math.max(3, CFG.lives - Math.floor(worldIdx / 2)),
            round: 1, gameNum: 0, totalGames: 0,
            combo: 0, maxCombo: 0, streak: 0, bestStreak: 0,
            correct: 0, wrong: 0,
            paused: false, answering: false,
            timer: null, timeLeft: 0, totalTime: 0,
            current: null, startTime: Date.now()
        };

        // Scale difficulty based on world
        const origBaseTime = CFG.baseTime;
        CFG.baseTime = Math.max(2500, 5000 / w.speedMult);
        CFG.gamesPerRound = isBoss ? 8 : 5;
        CFG.maxRounds = isBoss ? 2 : 3;

        showScreen('gameScreen');
        updateHUD();

        const el = $('roundOverlay');
        el.innerHTML = `
            <div style="font-size:3.5rem;animation:${isBoss ? 'wobble 1s ease infinite' : 'float 2s ease infinite'}">${isBoss ? w.bossEmoji : w.emoji}</div>

            <div class="round-tip">World ${worldIdx + 1} - ${w.name}</div>
        `;
        el.classList.add('active');
        SFX.levelUp();

        setTimeout(() => {
            el.classList.remove('active');
            showRound();
        }, 2200);

        // Store original config to restore later
        this._origBaseTime = origBaseTime;
    }

    endLevel(completed) {
        this.active = false;
        const worldIdx = this.currentWorld;
        const levelIdx = this.currentLevel;
        const w = this.worlds[worldIdx];
        const prog = this.getWorldProgress(worldIdx);

        // Restore config
        if (this._origBaseTime) CFG.baseTime = this._origBaseTime;
        CFG.gamesPerRound = 5;
        CFG.maxRounds = 15;

        if (completed) {
            const stars = this.getStarsForScore(G.score);
            if (!prog.bestScores) prog.bestScores = [];

            // Update best score for this level
            const prevBest = prog.bestScores[levelIdx] || 0;
            if (G.score > prevBest) prog.bestScores[levelIdx] = G.score;

            // Update completion
            if (levelIdx + 1 > (prog.completed || 0)) {
                prog.completed = levelIdx + 1;
            }

            // Recalculate total stars
            prog.stars = prog.bestScores.reduce((sum, s) => sum + this.getStarsForScore(s), 0);

                </div>
                <div class="go-buttons">

                </div>
            `;
        } else {

            },

                icon: '🎮',

                color: 'var(--acid-green)'
            },
            {
                title: 'LET\'S GO BONKERS!',
                icon: '🚀',
                text: 'That\'s it! Tap, click, dodge, catch, type, shake, and SURVIVE!',
                color: 'var(--psycho-purple)'
            }
        ];

        let current = 0;

        const render = () => {
            const s = steps[current];
            overlay.innerHTML = `
                <div style="text-align:center;max-width:450px">
                    <div style="font-size:4rem;margin-bottom:12px;animation:wobble 1.5s ease infinite">${s.icon}</div>
                    <div style="font-family:'Impact',sans-serif;font-size:clamp(1.5rem,5vw,2.5rem);color:${s.color};text-shadow:0 0 15px ${s.color}44;margin-bottom:12px">${s.title}</div>
                    <div style="font-size:1.05rem;line-height:1.6;color:#ccc;margin-bottom:25px">${s.text}</div>
                    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:18px">
                        ${steps.map((_,i) => `<div style="width:8px;height:8px;border-radius:50%;background:${i===current?s.color:'rgba(255,255,255,0.15)'};transition:background 0.3s"></div>`).join('')}
                    </div>
                    <div style="display:flex;gap:10px;justify-content:center">
                        ${current > 0 ? '<button class="btn btn-alt" id="tutBack">BACK</button>' : ''}
                        <button class="btn btn-play" style="padding:14px 35px;font-size:1rem" id="tutNext">${current === steps.length - 1 ? 'LET\'S GO!' : 'NEXT'}</button>
                    </div>
                    <div style="margin-top:12px">
                        <button style="background:none;border:none;color:#444;cursor:pointer;font-size:0.8rem" id="tutSkip">Skip tutorial</button>
                    </div>
                </div>
            `;

            document.getElementById('tutNext').onclick = () => {
                SFX.pop();
                if (current < steps.length - 1) { current++; render(); }
                else close();
            };

            const backBtn = document.getElementById('tutBack');
            if (backBtn) backBtn.onclick = () => { SFX.pop(); current--; render(); };

            document.getElementById('tutSkip').onclick = () => { SFX.pop(); close(); };
        };

        const close = () => {
            overlay.style.opacity = '0';
            overlay.style.transition = 'opacity 0.3s';
            setTimeout(() => {
                overlay.remove();
                this.seen = true;
                localStorage.setItem('bb_tutorial', 'true');
                callback();
            }, 300);
        };

        document.body.appendChild(overlay);
        render();
    }

    reset() {
        localStorage.removeItem('bb_tutorial');
        this.seen = false;
    }
}

// PARTICLE TEXT EFFECTS
// ==========================================
class TextParticles {
    static emit(text, x, y, color, size = '1.5rem') {
        const chars = text.split('');
        chars.forEach((ch, i) => {
            const el = document.createElement('div');
            el.textContent = ch;
            el.style.cssText = `position:fixed;left:${x + i * 12}px;top:${y}px;
                font-family:'Impact',sans-serif;font-size:${size};color:${color};
                pointer-events:none;z-index:400;
                text-shadow:0 0 8px ${color}`;
            document.body.appendChild(el);

            const angle = RF(-1, -0.5) * Math.PI;
            const speed = RF(2, 5);
            const vx = Math.cos(angle + RF(-0.3, 0.3)) * speed;
            const vy = Math.sin(angle) * speed * 2;
            let cx = x + i * 12, cy = y, life = 1;

            const anim = () => {
                cx += vx;
                cy += vy + 1;
                life -= 0.02;
                el.style.left = cx + 'px';
                el.style.top = cy + 'px';
                el.style.opacity = life;
                el.style.transform = `rotate(${(1-life) * RF(-60, 60)}deg)`;
                if (life > 0) requestAnimationFrame(anim);
                else el.remove();
            };
            setTimeout(anim, i * 30);
        });
    }

    static celebrate(text, color) {
        this.emit(text, innerWidth / 2 - text.length * 6, innerHeight / 2 - 30, color, '2rem');
    }
}

// ==========================================
// SCREEN WIPE TRANSITIONS BETWEEN GAMES
// ==========================================
class ScreenWipes {
    static play() {
        if (!settings.data.transitions) return;
        const wipes = [this.blinds, this.diagonal, this.dots, this.flash, this.swirl];
        pick(wipes).call(this);
    }

    static blinds() {
        const count = 8;
        for (let i = 0; i < count; i++) {
            const bar = document.createElement('div');
            bar.style.cssText = `position:fixed;top:${(i/count)*100}%;left:0;width:0;height:${100/count+0.5}%;
                background:hsl(${R(0,360)},80%,50%);z-index:650;pointer-events:none;
                transition:width 0.15s ease ${i*0.02}s`;
            document.body.appendChild(bar);
            requestAnimationFrame(() => {
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.opacity = '0';
                    bar.style.transition = 'opacity 0.2s';
                    setTimeout(() => bar.remove(), 200);
                }, 200);
            });
        }
    }

    static diagonal() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:-100%;left:-100%;width:300%;height:300%;
            background:linear-gradient(45deg,transparent 45%,rgba(255,20,147,0.3) 45%,rgba(255,20,147,0.3) 55%,transparent 55%);
            z-index:650;pointer-events:none;transition:transform 0.4s ease;transform:translateX(-100%)`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
            el.style.transform = 'translateX(100%)';
            setTimeout(() => el.remove(), 400);
        });
    }

    static dots() {
        for (let i = 0; i < 15; i++) {
            const dot = document.createElement('div');
            const size = R(20, 60);
            dot.style.cssText = `position:fixed;z-index:650;pointer-events:none;
                width:${size}px;height:${size}px;border-radius:50%;
                left:${R(0,100)}%;top:${R(0,100)}%;
                background:hsl(${R(0,360)},80%,60%);
                animation:firework 0.4s ease ${i*0.02}s both`;
            document.body.appendChild(dot);
            setTimeout(() => dot.remove(), 500);
        }
    }

    static flash() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;
            background:#fff;z-index:650;pointer-events:none;opacity:0.3;
            transition:opacity 0.15s`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
            el.style.opacity = '0';
            setTimeout(() => el.remove(), 150);
        });
    }

    static swirl() {
        const el = document.createElement('div');
        el.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0) rotate(0deg);
            width:200vmax;height:200vmax;border-radius:50%;
            background:conic-gradient(var(--hot-pink),var(--electric-blue),var(--acid-green),var(--banana-yellow),var(--hot-pink));
            z-index:650;pointer-events:none;opacity:0.2;
            transition:transform 0.4s ease,opacity 0.3s`;
        document.body.appendChild(el);
        requestAnimationFrame(() => {
            el.style.transform = 'translate(-50%,-50%) scale(1) rotate(180deg)';
            setTimeout(() => {
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            }, 200);
        });
    }
}

        }
    }

        this.data.coins += amount;
        this.save();

    buy(id, cost) {
        if (this.data.coins < cost) return false;
        if (this.owns(id)) return false;
        this.data.coins -= cost;
        this.data.owned.push(id);
        this.save();
        return true;
    }

                        const equipped = this.data.equipped[type] === item.id;
                        const canAfford = this.data.coins >= item.cost;
                        return `
                            <div style="
                                background:${equipped ? 'rgba(118,255,3,0.08)' : owned ? 'rgba(255,255,255,0.04)' : 'rgba(255,255,255,0.02)'};
                                border:2px solid ${equipped ? 'var(--acid-green)' : owned ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.04)'};
                                border-radius:10px;padding:10px;text-align:center;cursor:${owned || canAfford ? 'pointer' : 'default'};
                                opacity:${owned || canAfford ? 1 : 0.4};transition:all 0.15s"
                                onclick="${owned ? `shop.equip('${type}','${item.id}');shop.show()` : canAfford ? `shop.buyAndShow('${item.id}',${item.cost})` : ''}"
                                ${owned || canAfford ? 'onmouseover="this.style.transform=\'translateY(-2px)\'" onmouseout="this.style.transform=\'\'"' : ''}>
                                <div style="font-size:1.8rem">${item.emoji}</div>
                                <div style="font-size:0.75rem;font-weight:700;color:#ccc;margin-top:3px">${item.name}</div>
                                <div style="font-size:0.65rem;color:#666">${item.desc}</div>
                                <div style="font-size:0.7rem;margin-top:4px;${equipped ? 'color:var(--acid-green)' : owned ? 'color:#888' : canAfford ? 'color:var(--banana-yellow)' : 'color:#444'}">
                                    ${equipped ? '✓ EQUIPPED' : owned ? 'OWNED' : `🪙 ${item.cost}`}
                                </div>
                            </div>`;
                    }).join('')}
                </div>
            </div>`;
    }

    buyAndShow(id, cost) {
        if (this.buy(id, cost)) {
            SFX.correct();
            bg.burst(innerWidth / 2, innerHeight / 2, '#ffea00', 15);
        }
        this.show();
    }
}

    const correctEmoji = chain.emoji[missingIdx];
    const display = [...chain.emoji];
    display[missingIdx] = '❓';

    const wrongs = ['🤷','🎸','🚗','🧊','🏀','🎭','📱','🎪'].filter(e => !chain.emoji.includes(e));
    const choices = shuffle([correctEmoji, ...shuffle(wrongs).slice(0, 3)]);

    return {
        name: 'COMPLETE THE CHAIN!',
        color: 'var(--mint)',
        start() {
            clearArea();
            setInstruction(`${chain.label}: WHAT'S MISSING?`, 'var(--mint)');

            const chainDisplay = document.createElement('div');
            chainDisplay.style.cssText = 'display:flex;gap:8px;font-size:2.5rem;margin:50px 0 25px;align-items:center;justify-content:center';

                if (i < display.length - 1) {
                    const arrow = document.createElement('span');
                    arrow.textContent = '→';
                    arrow.style.color = '#555';
                    arrow.style.fontSize = '1.2rem';
                    chainDisplay.appendChild(arrow);
                }
                if (i === display.length - 1) chainDisplay.appendChild(el);
            });
            area().appendChild(chainDisplay);

            const grid = document.createElement('div');
            grid.className = 'match-grid';
            grid.style.gridTemplateColumns = 'repeat(2, clamp(70px,20vw,100px))';
            choices.forEach(c => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.textContent = c;
                card.onclick = () => answer(c === correctEmoji);
                grid.appendChild(card);
            });
            area().appendChild(grid);
        }
    };
}

class ComboMusic {
    static playComboNote(combo) {
        if (!SFX.ctx) return;
        // Play increasingly epic notes as combo builds
        const scales = {
            1: [523],
            2: [523, 659],
            3: [523, 659, 784],
            4: [523, 659, 784, 1047],
            5: [659, 784, 1047, 1319],
            6: [784, 1047, 1319, 1568],
            7: [1047, 1319, 1568, 2093],
            8: [1319, 1568, 2093, 2637]
        };
        const notes = scales[Math.min(combo, 8)] || scales[1];
        notes.forEach((n, i) => {
            setTimeout(() => SFX.play(n, 0.08, 'sine', 0.12), i * 25);
        });
    }
}

// Play combo music on correct answers
const _musicAnswer = answer;
answer = function(correct, timeout = false) {
    _musicAnswer(correct, timeout);
    if (correct && G.combo >= 2) {
        ComboMusic.playComboNote(G.combo);
    }
};

                dot.style.height = '45px';
                dot.textContent = i + 1;
                dot.style.pointerEvents = 'none';
                dot.style.animation = `popIn 0.2s ease ${i * 0.15}s both`;
                area().appendChild(dot);
                dots.push(dot);
            });

            // After showing, enable clicking in reverse
            setTimeout(() => {
                if (!G.answering) return;
                const inst = area().querySelector('.instruction');
                if (inst) {
                    inst.textContent = 'NOW TAP ' + count + ' → 1!';
                    inst.style.color = 'var(--banana-yellow)';
                }
                dots.forEach((dot, i) => {
                    dot.style.pointerEvents = '';
                    dot.style.borderColor = 'rgba(255,255,255,0.2)';
                    dot.style.color = '#888';
                    dot.style.animation = '';
                    dot.onclick = function() {
                        const expectedOrigIdx = reversed[inputIdx];
                        if (i === expectedOrigIdx) {
                            this.classList.add('hit');
                            SFX.play(800 - inputIdx * 80, 0.08, 'sine', 0.15);
                            inputIdx++;
                            if (inputIdx >= count) answer(true);
                        } else {
                            answer(false);
                        }
                    };
                });
            }, count * 150 + 1200);
        }
    };
}

function mgWheelOfFortune() {
    // Wheel spin - just pick the right section
    const sections = ['🎁','💀','🎁','💀','🎁','💀','⭐','💀'];
    const winIdx = R(0, sections.length - 1);
    while (sections[winIdx] === '💀') sections[winIdx] = '🎁'; // Ensure win is possible

    return {
        name: 'SPIN THE WHEEL!',
        color: 'var(--banana-yellow)',
        start() {
            clearArea();
            setInstruction('TAP TO STOP ON 🎁 OR ⭐!', 'var(--banana-yellow)');

            let currentIdx = 0;
            let spinning = true;

            const wheel = document.createElement('div');
            wheel.style.cssText = 'display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:50px 0 20px;max-width:300px';

            const slotEls = sections.map((s, i) => {
                const el = document.createElement('div');
                el.style.cssText = `width:55px;height:55px;border-radius:10px;display:flex;align-items:center;justify-content:center;
                    font-size:1.8rem;border:2px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);transition:all 0.05s`;
                el.textContent = s;
                wheel.appendChild(el);
                return el;
            });
            area().appendChild(wheel);

            const stopBtn = document.createElement('button');
            stopBtn.className = 'btn btn-success';
            stopBtn.textContent = 'STOP!';
            stopBtn.style.padding = '16px 50px';
            stopBtn.style.fontSize = '1.3rem';
            stopBtn.onclick = () => {
                if (!spinning) return;
                spinning = false;
                const landed = sections[currentIdx];
                const win = landed === '🎁' || landed === '⭐';
                slotEls[currentIdx].style.borderColor = win ? 'var(--acid-green)' : 'var(--lava-red)';
                slotEls[currentIdx].style.boxShadow = `0 0 20px ${win ? 'var(--acid-green)' : 'var(--lava-red)'}`;
                setTimeout(() => answer(win), 400);
            };
            area().appendChild(stopBtn);

            const speed = R(80, 150);
            startLoop(() => {
                if (!spinning) return;
                slotEls.forEach(el => {
                    el.style.borderColor = 'rgba(255,255,255,0.1)';
                    el.style.background = 'rgba(255,255,255,0.03)';
                    el.style.transform = '';
                });
                currentIdx = (currentIdx + 1) % sections.length;
                slotEls[currentIdx].style.borderColor = 'var(--banana-yellow)';
                slotEls[currentIdx].style.background = 'rgba(255,234,0,0.1)';
                slotEls[currentIdx].style.transform = 'scale(1.15)';
                SFX.play(400 + currentIdx * 30, 0.02, 'sine', 0.08);
            }, speed);
        }
    };
}

function mgTreasureMap() {
    const gridSize = 4;
    const treasureIdx = R(0, gridSize * gridSize - 1);
    let attempts = 0;
    const maxAttempts = 3;

    return {
        name: 'DIG FOR TREASURE!',
        color: 'var(--banana-yellow)',
        start() {
            clearArea();
            setInstruction(`${maxAttempts} DIGS! FIND THE 💎!`, 'var(--banana-yellow)');

            const attemptsEl = document.createElement('div');
            attemptsEl.id = 'digAttempts';
            attemptsEl.style.cssText = 'font-size:1rem;color:var(--banana-yellow);margin:50px 0 12px;font-weight:700';
            attemptsEl.textContent = `Digs left: ${'⛏️'.repeat(maxAttempts)}`;
            area().appendChild(attemptsEl);

            const grid = document.createElement('div');
            grid.className = 'match-grid';
            grid.style.gridTemplateColumns = `repeat(${gridSize}, clamp(55px, 16vw, 75px))`;

            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'match-card';
                cell.style.width = 'clamp(55px, 16vw, 75px)';
                cell.style.height = 'clamp(55px, 16vw, 75px)';
                cell.style.fontSize = '1.5rem';
                cell.textContent = '🟫';

                cell.onclick = function() {
                    if (this.dataset.dug) return;
                    this.dataset.dug = 'true';
                    attempts++;

                    if (i === treasureIdx) {
                        this.textContent = '💎';
                        this.classList.add('correct');
                        SFX.correct();
                        answer(true);
                        return;
                    }

                    // Show proximity hint
                    const tRow = Math.floor(treasureIdx / gridSize);
                    const tCol = treasureIdx % gridSize;
                    const cRow = Math.floor(i / gridSize);
                    const cCol = i % gridSize;
                    const distance = Math.abs(tRow - cRow) + Math.abs(tCol - cCol);

                    if (distance <= 1) {
                        this.textContent = '🔥';
                        this.style.borderColor = 'var(--vivid-orange)';
                    } else if (distance <= 2) {
                        this.textContent = '🌡️';
                        this.style.borderColor = 'var(--banana-yellow)';
                    } else {
                        this.textContent = '❄️';
                        this.style.borderColor = 'var(--electric-blue)';
                    }
                    this.style.pointerEvents = 'none';
                    SFX.play(200, 0.05, 'square', 0.1);

                    const ae = document.getElementById('digAttempts');
                    if (ae) ae.textContent = `Digs left: ${'⛏️'.repeat(maxAttempts - attempts)}`;

                    if (attempts >= maxAttempts) {
                        setTimeout(() => answer(false), 300);
                    }
                };
                grid.appendChild(cell);
            }
            area().appendChild(grid);

            const hint = document.createElement('div');
            hint.style.cssText = 'font-size:0.75rem;color:#444;margin-top:10px';
            hint.textContent = '🔥 = Hot! 🌡️ = Warm ❄️ = Cold';
            area().appendChild(hint);
        }
    };
}

                if (clicks >= target) {
                    clearInterval(timerLoop);
                    answer(true);
                }
            };
            area().appendChild(btn);

            const timerLoop = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const remaining = Math.max(0, timeLimit - elapsed);
                const te = document.getElementById('blastTimer');
                if (te) {
                    te.textContent = remaining.toFixed(1) + 's';

}

function mgEmojiMaze() {
    // Simple: find the path from 🏁 to 🏆
    const size = 4;
    const start = 0;
    const end = size * size - 1;
    let pos = start;

    return {
        name: 'REACH THE TROPHY!',
        color: 'var(--banana-yellow)',
        start() {
            clearArea();
            setInstruction('TAP ADJACENT CELLS TO MOVE!', 'var(--banana-yellow)');

            const grid = document.createElement('div');
            grid.id = 'mazeGrid';
            grid.style.cssText = `display:grid;grid-template-columns:repeat(${size},60px);gap:4px;justify-content:center;margin-top:50px`;

            // Generate random walls (30% chance)
            const walls = new Set();
            for (let i = 1; i < size * size - 1; i++) {
                if (Math.random() < 0.25) walls.add(i);
            }

            const renderMaze = () => {
                grid.innerHTML = '';
                for (let i = 0; i < size * size; i++) {
                    const cell = document.createElement('div');
                    const isWall = walls.has(i);
                    const isPlayer = i === pos;
                    const isEnd = i === end;
                    const isStart = i === start;

                    cell.style.cssText = `width:60px;height:60px;border-radius:8px;display:flex;align-items:center;justify-content:center;
                        font-size:1.5rem;transition:all 0.1s;cursor:${isWall ? 'default' : 'pointer'};
                        background:${isWall ? 'rgba(255,255,255,0.15)' : isPlayer ? 'rgba(118,255,3,0.15)' : 'rgba(255,255,255,0.03)'};
                        border:2px solid ${isPlayer ? 'var(--acid-green)' : isEnd ? 'var(--banana-yellow)' : isWall ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.06)'}`;

                    if (isPlayer) cell.textContent = '🏃';
                    else if (isEnd) cell.textContent = '🏆';
                    else if (isWall) cell.textContent = '🧱';

                    if (!isWall) {
                        cell.onclick = () => {
                            // Check adjacency
                            const pRow = Math.floor(pos / size), pCol = pos % size;
                            const cRow = Math.floor(i / size), cCol = i % size;
                            const adjacent = (Math.abs(pRow - cRow) + Math.abs(pCol - cCol)) === 1;

                            if (adjacent && !walls.has(i)) {
                                pos = i;
                                SFX.play(400 + pos * 20, 0.04, 'sine', 0.1);
                                renderMaze();
                                if (pos === end) answer(true);
                            }
                        };
                    }
                    grid.appendChild(cell);
                }
            };

            area().appendChild(grid);
            renderMaze();
        }
    };
}

                area().querySelectorAll('.grav-item').forEach(item => {
                    const ix = parseFloat(item.style.left) + 12;
                    const iy = parseFloat(item.style.top) + 12;
                    if (dist(cx, cy, ix, iy) < 45) {
                        if (item.dataset.good === 'true') {
                            caught++;
                            SFX.pop();
                            item.textContent = '✨';
                            item.style.pointerEvents = 'none';
                            setTimeout(() => item.remove(), 100);
                            const c = document.getElementById('gravCounter');
                            if (c) c.textContent = `${caught}/${goal}`;
                            if (caught >= goal) answer(true);
                        } else {
                            SFX.boom();
                            answer(false);
                        }
                    }
                });
            };

            const spawn = () => {
                if (!G.answering) return;
                const isGood = Math.random() > 0.5;
                const item = document.createElement('div');
                item.className = 'grav-item';
                item.dataset.good = isGood.toString();
                item.style.cssText = `position:absolute;font-size:1.8rem;left:${R(10,b.w-30)}px;top:-25px;pointer-events:none;z-index:5`;
                item.textContent = isGood ? '🟢' : '🔴';
                item._vy = RF(1.5, 3.5);
                area().appendChild(item);
                setTimeout(spawn, R(250, 600));
            };
            spawn();

            startLoop(() => {
                area().querySelectorAll('.grav-item').forEach(item => {
                    const y = parseFloat(item.style.top) + (item._vy || 2);
                    item.style.top = y + 'px';
                    if (y > b.h + 20) item.remove();
                });
            }, 16);
        }
    };
}
